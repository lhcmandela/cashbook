<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VaultStack">
<title>VaultStack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
/* Apple system palette: grouped background, white cards, one sea-blue tint.
   Dark mode follows the phone. */
:root{
  color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--sheet:#FFFFFF;--hl:#E5E5EA;
  --label:#000000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);
  --fill:rgba(120,120,128,.12);--seg-on:#FFFFFF;
  --tint:#0A7CC1;--tint-soft:rgba(10,124,193,.12);
  --green:#34C759;--green-t:#248A3D;--orange:#FF9500;--orange-t:#C35A00;--red:#FF3B30;
  --overlay:rgba(0,0,0,.28);
  --glass-bg:rgba(255,255,255,.62);--glass-brd:rgba(255,255,255,.8);
  --glass-shadow:0 8px 30px rgba(0,0,0,.10),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.035);
  --tabidle:#3C3C43;--poster:#B7DCF2;--poster2:#D6ECF8;--lock1:#E3F0F9;--hud:rgba(236,236,240,.96);--desk:#E5E5EA;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--hl:#3A3A3C;
    --label:#FFFFFF;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.26);--seg-on:#636366;
    --tint:#40B4F2;--tint-soft:rgba(64,180,242,.18);
    --green:#30D158;--green-t:#30D158;--orange:#FF9F0A;--orange-t:#FF9F0A;--red:#FF453A;
    --overlay:rgba(0,0,0,.5);
    --glass-bg:rgba(46,46,50,.58);--glass-brd:rgba(255,255,255,.13);
    --glass-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.13);
    --tabidle:#D1D1D6;--poster:#0E3A57;--poster2:#08233A;--lock1:#0A2233;--hud:#2C2C2E;--desk:#0B0B0C;
  }
}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.011em;overflow:hidden;
}
#root{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.vs-shell{width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.vs-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:560px){
  body{background:var(--desk)}
  .vs-shell{height:calc(100% - 48px);max-height:900px;margin:auto;border-radius:44px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px -20px rgba(0,0,0,.28)}
}
input,button,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-appearance:none;appearance:none}
::selection{background:var(--tint-soft)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vs-press:active{opacity:.6}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px}

/* ---- type ---- */
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:-.005em}
.lt{font-size:34px;font-weight:700;letter-spacing:-.028em;line-height:41px}
.lsub{font-size:15px;color:var(--sec);margin-top:1px;letter-spacing:-.012em}
.px{padding-left:16px;padding-right:16px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:26px 4px 10px}
.sh b{font-size:22px;font-weight:700;letter-spacing:-.026em}
.caps{font-size:13px;color:var(--sec);text-transform:uppercase;padding:22px 4px 7px;letter-spacing:-.005em}
.foot{font-size:13px;color:var(--sec);padding:8px 4px 0;line-height:1.4}
.center{text-align:center}
.link{border:none;background:none;padding:0;color:var(--tint);font-size:17px;letter-spacing:-.02em;cursor:pointer}

/* ---- surfaces + lists ---- */
.card{background:var(--card);border-radius:22px}
.group{background:var(--card);border-radius:22px;overflow:hidden}
.li{position:relative;background:var(--card)}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:var(--inset,64px);height:.5px;background:var(--sep);z-index:3}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.vrow.sm{min-height:48px;padding:8px 16px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active,.tap:active .sw-row{background:var(--hl)}
.tx{flex:1;min-width:0}
.tt{font-size:17px;font-weight:600;letter-spacing:-.022em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:15px;color:var(--sec);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.012em}
.am{font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--ter);display:flex;flex-shrink:0;margin-left:-2px}
.warn{color:var(--orange-t);font-weight:600}
.sq{display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.mono{border-radius:50%;background:linear-gradient(180deg,#A9B1BC,#7F8893);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0}
.g2{background:var(--card2)} .g2 .li{background:var(--card2)} .g2 .sw-row{background:var(--card2)}
.empty{padding:22px 18px;text-align:center;color:var(--sec);font-size:15px;line-height:1.45}

/* ---- swipe rows ---- */
.swipe{overflow:hidden}
.sw-act{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:0}
.sw-act button{width:84px;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;cursor:pointer}
.sw-row{position:relative;z-index:1;background:var(--card);touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.85,.25,1);user-select:none;-webkit-user-select:none}
.sw-row.drag{transition:none}

/* ---- controls ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;font-weight:600;letter-spacing:-.02em;cursor:pointer;width:100%}
.seg{height:36px;border-radius:18px;background:var(--fill);display:flex;padding:2px}
.seg button{flex:1;min-width:0;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--label);border-radius:16px;cursor:pointer;letter-spacing:-.012em;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{position:relative;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--label);border:none;cursor:pointer;white-space:nowrap;letter-spacing:-.015em}
.chip.on{background:var(--tint-soft);color:var(--tint)}
.chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.get{height:30px;padding:0 15px;border-radius:15px;background:var(--tint-soft);color:var(--tint);font-weight:700;font-size:15px;display:flex;align-items:center;letter-spacing:-.01em;flex-shrink:0;border:none;cursor:pointer}
.sw{width:51px;height:31px;border-radius:16px;border:none;background:var(--fill);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;padding:0}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .22s}
.sw.on{background:var(--green)} .sw.on i{transform:translateX(20px)} .sw:disabled{opacity:.4}
.frow{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;--inset:16px;cursor:text}
.flab{font-size:17px;letter-spacing:-.02em;flex-shrink:0;color:var(--label)}
.frow input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:17px;color:var(--label);text-align:right;letter-spacing:-.02em;height:48px;padding:0}
.frow input::placeholder{color:var(--ter)}
.frow.solo input{text-align:left}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);margin:8px -4px 0}
.kkey{height:60px;border:none;background:transparent;font-size:30px;font-weight:400;color:var(--label);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kkey:active{background:var(--fill)}
.bigamt{text-align:center;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:14px;white-space:nowrap}
.bigamt small{font-size:28px;font-weight:600;color:var(--sec);letter-spacing:-.02em;vertical-align:top;position:relative;top:8px;margin-right:6px}
.ksub{display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;color:var(--sec);letter-spacing:-.012em}
.kmsg{text-align:center;font-size:14px;margin-top:10px;min-height:18px;letter-spacing:-.01em}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 12px;border:none;border-radius:16px;background:var(--card2);text-align:left;cursor:pointer;color:var(--label);min-width:0}
.cat span{font-size:15px;font-weight:500;letter-spacing:-.015em;line-height:1.25;overflow-wrap:anywhere;min-width:0}

/* ---- liquid glass ---- */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);border:.5px solid var(--glass-brd);box-shadow:var(--glass-shadow)}
.glass-sky{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.38);box-shadow:0 8px 30px rgba(10,40,80,.18),inset 0 1px 1px rgba(255,255,255,.5);color:#fff}
.gbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label);cursor:pointer;padding:0;flex-shrink:0}
.navrow{height:56px;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
.tabbar{position:absolute;left:12px;right:88px;bottom:calc(max(env(safe-area-inset-bottom,0px),20px) - 6px);height:64px;border-radius:32px;display:flex;padding:4px;z-index:30}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:none;background:transparent;border-radius:28px;font-size:10px;font-weight:600;color:var(--tabidle);cursor:pointer;padding:0;letter-spacing:0}
.tab.on{color:var(--tint);background:var(--fill)}
.tabbar.glass-sky .tab{color:#fff} .tabbar.glass-sky .tab.on{background:rgba(255,255,255,.24);color:#fff}
.fab{position:absolute;right:12px;bottom:calc(max(env(safe-area-inset-bottom,0px),20px) - 6px);width:64px;height:64px;border-radius:50%;z-index:30;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0}
.fab.glass{background:var(--tint);background:color-mix(in srgb,var(--tint) 88%,transparent);border-color:rgba(255,255,255,.4)}
.fab.glass-sky{background:rgba(255,255,255,.26)}
.edgefade{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:20;pointer-events:none;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 88%,transparent) 70%)}
.menu-ov{position:absolute;inset:0;z-index:40;touch-action:none}
.sheet-open .vs-scroll{overflow:hidden;touch-action:none}
.sheet-open,.sheet-open body{overscroll-behavior:none}
.menu{position:absolute;z-index:41;min-width:230px;border-radius:22px;padding:6px;animation:vpop .18s ease}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:48px;padding:0 14px;border:none;background:transparent;font-size:17px;letter-spacing:-.02em;border-radius:14px;cursor:pointer;color:var(--label)}
.mi:active{background:var(--fill)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(env(safe-area-inset-bottom,0px),20px) + 72px);z-index:45;max-width:88%;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:rgba(28,28,30,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:15px;font-weight:500;letter-spacing:-.015em;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:vpop .2s ease}

/* ---- sheets ---- */
.ov{position:fixed;inset:0;overscroll-behavior:contain;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:vfade .2s ease}
.sheet{background:var(--sheet);width:100%;max-width:430px;max-height:94%;border-radius:38px 38px 0 0;display:flex;flex-direction:column;animation:vup .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ter);margin:7px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 6px;flex-shrink:0;gap:8px}
.stitle{font-size:17px;font-weight:600;letter-spacing:-.022em;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{background:var(--fill);border:none}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.stmt{background:var(--card2);border-radius:16px;padding:14px 16px;margin:0 0 16px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--label)}
@keyframes vup{from{transform:translateY(100%)}to{transform:none}}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes vpop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.toast{animation-name:vfade}

/* ---- home ---- */
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#A9B1BC,#7F8893);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:3px;border:none;cursor:pointer;flex-shrink:0;padding:0}
.pass{height:206px;border-radius:24px;position:relative;overflow:hidden;color:#fff;padding:18px 20px;
  background:radial-gradient(110% 80% at 100% 0%,rgba(64,190,245,.75) 0%,rgba(64,190,245,0) 60%),linear-gradient(160deg,#0E6799 0%,#0A4470 55%,#062840 100%);
  box-shadow:0 14px 30px -12px rgba(8,60,100,.55)}
.pass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 38%);pointer-events:none}
.pwaves{position:absolute;left:0;bottom:-58px;width:100%;height:120px;opacity:.16}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
.pbrand{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.pseason{font-size:13px;font-weight:600;opacity:.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbot{position:absolute;left:20px;right:20px;bottom:18px;z-index:1}
.pl{font-size:13px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.03em}
.pv{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:2px;white-space:nowrap}
.pv small{font-size:22px;font-weight:600;opacity:.8;margin-right:5px;letter-spacing:-.01em}
.ps{font-size:13px;opacity:.72;margin-top:3px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qa{background:var(--card);border:none;border-radius:22px;padding:16px 16px 15px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--label);cursor:pointer;min-width:0;min-height:128px}
.qi{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.qt{font-size:19px;font-weight:700;letter-spacing:-.025em;margin-top:auto;padding-top:14px}
.qs{font-size:13px;color:var(--sec);margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--card);border-radius:22px;padding:14px 14px 13px;border:none;text-align:left;color:var(--label);cursor:pointer;min-width:0}
.tile-h{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;letter-spacing:-.015em}
.tile .v{margin-top:16px;font-weight:700;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.tile .v small{font-size:15px;font-weight:600;color:var(--sec);margin-right:3px;letter-spacing:-.01em}
.tile .u{font-size:13px;color:var(--sec);margin-top:5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:16px;position:relative;padding:0 4px}
.bars .bar{flex:1;border-radius:8px;background:var(--tint-soft);min-width:0}
.bars .bar.hl{background:var(--tint)}
.avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ter)}
.blab{display:flex;gap:10px;padding:0 4px;margin-top:7px}.blab span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--sec);font-weight:500;white-space:nowrap;overflow:hidden}

/* ---- summaries ---- */
.sum{padding:16px 18px}
.sum .lbl{font-size:15px;color:var(--sec);font-weight:500;letter-spacing:-.015em}
.bigsum{font-size:34px;font-weight:700;letter-spacing:-.035em;margin-top:2px;line-height:1.15;white-space:nowrap}
.bigsum small{font-size:20px;color:var(--sec);font-weight:600;margin-right:5px;letter-spacing:-.01em}
.stack{display:flex;gap:3px;height:10px;margin-top:16px}.stack i{border-radius:5px;display:block;min-width:4px}
.legend{display:flex;margin-top:12px;gap:12px}.legend>div{flex:1;min-width:0}
.legend .k{font-size:13px;color:var(--sec);display:flex;align-items:center;gap:6px;font-weight:500}
.legend .k i{width:8px;height:8px;border-radius:50%;display:block;flex-shrink:0}
.legend .n{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- worker page ---- */
.wpage{position:relative}
.poster{position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(180deg,var(--poster) 0%,var(--poster2) 45%,var(--bg) 100%)}
.bigmono{width:112px;height:112px;border-radius:50%;margin:2px auto 0;background:linear-gradient(180deg,#5DB3E3,#0A6FA8);color:#fff;font-size:50px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(10,111,168,.6)}
.acts{display:flex;gap:8px;margin-top:20px}
.acts button{flex:1;min-width:0;height:64px;border-radius:16px;background:var(--card);border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tint);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:-.005em;padding:0}
.meter{height:8px;border-radius:4px;background:var(--fill);margin-top:14px;overflow:hidden}.meter i{display:block;height:100%;background:var(--tint);border-radius:4px}

/* ---- sea ---- */
.sky{min-height:100%;color:#fff}
.wc{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.28);border-radius:22px;padding:12px 15px 14px;color:#fff}
.wh{font-size:13px;font-weight:600;color:rgba(255,255,255,.66);text-transform:uppercase;display:flex;gap:6px;align-items:center;letter-spacing:.02em}
.scale{height:6px;border-radius:3px;margin-top:14px;position:relative;background:linear-gradient(90deg,#34C759 0%,#7ADB5A 28%,#FFD60A 48%,#FF9F0A 68%,#FF453A 100%)}
.scale i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(20,60,110,.55);transition:left .6s ease}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wv{font-size:42px;font-weight:500;letter-spacing:-.04em;margin-top:12px;line-height:1;white-space:nowrap}.wv small{font-size:19px;font-weight:500;margin-left:3px;letter-spacing:-.01em}
.wf{font-size:14px;margin-top:14px;color:rgba(255,255,255,.9);line-height:1.3}

/* ---- lock + passcode ---- */
.appicon{display:flex;align-items:center;justify-content:center;margin:0 auto;flex-shrink:0;color:#fff;
  background:radial-gradient(90% 80% at 85% 10%,rgba(80,200,250,.9),rgba(80,200,250,0) 60%),linear-gradient(160deg,#0E6799,#073556);
  box-shadow:0 18px 36px -14px rgba(8,60,100,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.lockscr{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow-y:auto;
  padding:40px 24px calc(env(safe-area-inset-bottom,0px) + 30px);background:linear-gradient(180deg,var(--lock1) 0%,var(--bg) 60%)}
.hud{width:156px;height:156px;border-radius:36px;border:none;background:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--label);font-size:16px;font-weight:600;box-shadow:0 20px 50px -18px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.06);cursor:pointer;flex-shrink:0}
.passcode{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow-y:auto;background:var(--bg);
  padding:34px 24px calc(env(safe-area-inset-bottom,0px) + 22px)}
.pc-title{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:18px;text-align:center}
.pc-sub{font-size:15px;color:var(--sec);margin-top:4px;text-align:center}
.dots{display:flex;gap:22px;margin-top:26px;justify-content:center}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--label);display:block}.dots i.on{background:var(--label)}
.pc-err{min-height:20px;margin-top:14px;color:var(--red);font-size:15px;text-align:center}
.pc-pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin:14px 0}
.pc-key{width:78px;height:78px;border-radius:50%;border:none;background:var(--fill);color:var(--label);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pc-key span{font-size:34px;font-weight:400;line-height:1;letter-spacing:0}
.pc-key small{font-size:10px;font-weight:600;letter-spacing:.14em;margin-top:3px;min-height:12px}
.pc-key:active{background:var(--ter)}
.pc-text{width:78px;height:78px;border:none;background:transparent;color:var(--label);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.pc-foot{font-size:13px;color:var(--sec);min-height:18px;text-align:center;line-height:1.4}
@media (max-height:700px){.pc-pad{grid-template-columns:repeat(3,70px);gap:12px 22px}.pc-key,.pc-text{width:70px;height:70px}.pc-key span{font-size:30px}}

/* ---- onboarding ---- */
.onb{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.feats{margin-top:36px;display:flex;flex-direction:column;gap:24px;padding:0 30px}
.feat{display:flex;gap:16px;align-items:flex-start;color:var(--tint)}
.feat b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--label)}
.feat span{display:block;font-size:15px;color:var(--sec);margin-top:2px;line-height:1.35}
.bottom-actions{margin-top:auto;padding-top:28px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:14px;overflow:hidden}.prog i{display:block;height:100%;background:var(--tint);border-radius:2px;transition:width .3s}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

/* ===================== Local line-icon set ======================

/* One icon family: 24pt grid, round caps and joins, and a stroke weight
   chosen from the rendered size so every glyph reads at the same optical
   weight, the way SF Symbols scale. Filled variants mark the active tab. */
function iconWeight(size) {
  return size <= 14 ? 2.3 : size <= 17 ? 2.1 : size <= 21 ? 1.9 : size <= 26 ? 1.75 : size <= 40 ? 1.6 : 1.45;
}
function IconBase({size=24,color="currentColor",strokeWidth,fill="none",style,children,...rest}){
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
         strokeWidth={iconWeight(size)} strokeLinecap="round" strokeLinejoin="round"
         style={{ flexShrink: 0, display: "block", ...(style || {}) }} aria-hidden="true" {...rest}>
      {children}
    </svg>
  );
}
const Dot = ({ cx, cy, r = 1.1, color = "currentColor" }) => <circle cx={cx} cy={cy} r={r} fill={color} stroke="none" />;

/* navigation */
function HouseLine(p){return <IconBase {...p}><path d="M4 10.2 12 3.8l8 6.4V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.2H5.5A1.5 1.5 0 0 1 4 19z"/></IconBase>;}
function HouseFill({color="currentColor",...p}){return <IconBase {...p} color={color}><path fill={color} stroke="none" d="M3.3 10a1 1 0 0 1 .4-.8l7.7-6.1a1 1 0 0 1 1.2 0l7.7 6.1a1 1 0 0 1 .4.8V19a2 2 0 0 1-2 2H15v-5.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V21H5.3a2 2 0 0 1-2-2z"/></IconBase>;}

function NoteFill({color="currentColor",...p}){return <IconBase {...p} color={color}><path fill={color} stroke="none" fillRule="evenodd" d="M5 5.5h14A2.5 2.5 0 0 1 21.5 8v8a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 16V8A2.5 2.5 0 0 1 5 5.5ZM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Z"/></IconBase>;}
function Package(p){return <IconBase {...p}><path d="M12 3.2 20 7.5v9L12 20.8 4 16.5v-9z"/><path d="M4.3 7.7 12 12l7.7-4.3M12 12v8.6"/></IconBase>;}

function PeopleFill({color="currentColor",...p}){return <IconBase {...p} color={color}><circle cx="9" cy="8" r="3.6" fill={color} stroke="none"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0z" fill={color} stroke="none"/><path d="M15.5 4.9a3.2 3.2 0 0 1 0 6.2M17.5 13.9a6 6 0 0 1 3.5 5.6"/></IconBase>;}

/* sea + weather */

function DeleteLeft(p){return <IconBase {...p}><path d="M20 5.5H9.3a2 2 0 0 0-1.5.7L3 12l4.8 5.8a2 2 0 0 0 1.5.7H20a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Z"/><path d="m11.5 9.5 5 5M16.5 9.5l-5 5"/></IconBase>;}
const Info = PlusCircle;

/* tab bar: outline when idle, solid when selected (knock-outs keep the detail) */

/* ---------------- payout engine (positions; whole pot shared by units) ---------------- */
function positionPayFor(state, w) {
  if (!w.positionId) return 0;
  const p = state.positions.find((x) => x.id === w.positionId);
  return p ? Number(p.pay) || 0 : 0;
}
function workerNumbers(state, w, fin) {
  const unitShare = (Number(w.units) || 0) * fin.vpu;
  const posPay = positionPayFor(state, w);
  const grossShare = unitShare + posPay;
  const loansTotal = (w.loans || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const paymentsTotal = (w.payments || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const adj = w.adjustments || [];
  const bonusTotal = adj
    .filter((a) => a.kind === "bonus")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const dedTotal = adj
    .filter((a) => a.kind === "deduction")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const carried = Number(w.carriedDebt) || 0;
  const payout = grossShare + bonusTotal - dedTotal - loansTotal - paymentsTotal - carried;
  const borrowLimit = Math.max(0, grossShare + bonusTotal - dedTotal - loansTotal - carried);
  return {
    unitShare,
    posPay,
    grossShare,
    loansTotal,
    paymentsTotal,
    bonusTotal,
    dedTotal,
    carried,
    payout,
    borrowLimit,
  };
}

/* -------- password (PIN) storage: salted SHA-256, never plaintext -------- */
async function vsHashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ":" + pin + ":" + salt);
  const buf = await crypto.subtle.digest("SHA-256", data);
  const hex = Array.from(new Uint8Array(buf))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
  return salt + hex; /* salt travels with the record so vsVerifyPin can rebuild it */
}
async function vsVerifyPin(pin, record) {
  if (!record || typeof record !== "string") return false;
  if (record.startsWith("plain:")) return pin === record.slice(6);
  /* records written by older builds: the PIN was stored as plain digits */
  if (/^\d{4,8}$/.test(record)) return pin === record;
  /* current format: 16-char salt followed by the salted SHA-256 hash */
  if (/^[0-9a-f]{80}$/.test(record)) {
    const salt = record.slice(0, 16);
    return (await vsHashPin(pin, salt)) === record;
  }
  return false;
}
/* is this record already stored in the salted format? */
function vsPinIsSalted(record) {
  return typeof record === "string" && /^[0-9a-f]{80}$/.test(record);
}

/* -------- WebAuthn biometric unlock (real platform authenticator) --------
   The device's Face ID / Touch ID / Android biometric prompt is the
   authority. No biometric data ever reaches this app — only a key pair
   whose private key never leaves the device's secure hardware. The app
   stores only the credential id and marks the unlock method, never the
   PIN itself.
   ------------------------------------------------------------------------ */
const VS_BIO_KEY = "vaultstack:biometric:v1";
async function vsBioSupported() {
  try {
    if (!window.PublicKeyCredential || !navigator.credentials) return false;
    if (window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      return Boolean(
        await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
      );
    }
    return true;
  } catch {
    return false;
  }
}
async function vsBioEnroll() {
  if (!(await vsBioSupported())) throw new Error("Biometric unlock is not available on this device or browser.");
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "VaultStack" },
      user: {
        id: userId,
        name: "vaultstack-owner",
        displayName: "VaultStack owner",
      },
      pubKeyCredParams: [
        { type: "public-key", alg: -7 },
        { type: "public-key", alg: -257 },
      ],
      authenticatorSelection: {
        residentKey: "required",
        requireResidentKey: true,
        userVerification: "required",
      },
      timeout: 60000,
      attestation: "none",
    },
  });
  if (!cred) throw new Error("No credential was created.");
  localStorage.setItem(
    VS_BIO_KEY,
    JSON.stringify({
      credId: cred.id,
      enrolledAt: new Date().toISOString(),
    })
  );
  return true;
}
async function vsBioUnlock() {
  const raw = localStorage.getItem(VS_BIO_KEY);
  if (!raw) throw new Error("Biometric unlock is not set up on this device.");
  const rec = JSON.parse(raw);
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      rpId: location.hostname,
      allowCredentials: [{ id: base64urlToBuffer(rec.credId), type: "public-key" }],
      userVerification: "required",
      timeout: 60000,
    },
  });
  if (!assertion) throw new Error("Unlock was cancelled.");
  return true;
}
function base64urlToBuffer(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out.buffer;
}

/* -------- v8 payout engine: no owner's maintenance split -------- */
function computeFinancials2(state) {
  const grossSales = state.sales.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const cashReceived = state.sales.reduce((s, x) => s + salePaid(x), 0);
  const creditOutstanding = state.sales.reduce((s, x) => s + saleOutstanding(x), 0);
  const fixedTotal = state.season.fixed.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const varTotal = state.expenses.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const netPot = grossSales - fixedTotal - varTotal;
  const positionsTotal = state.workers.reduce((s, w) => s + positionPayFor(state, w), 0);
  const beforeSplit = state.company.positionsBeforeSplit !== false;
  const potForSplit = beforeSplit ? Math.max(0, netPot - positionsTotal) : Math.max(0, netPot);
  const totalUnits = state.workers.reduce((s, w) => s + (Number(w.units) || 0), 0);
  const vpu = totalUnits > 0 ? potForSplit / totalUnits : 0;
  return {
    grossSales,
    cashReceived,
    creditOutstanding,
    fixedTotal,
    varTotal,
    netPot,
    positionsTotal,
    beforeSplit,
    potForSplit,
    totalUnits,
    vpu,
  };
}

/* list row with iOS swipe actions; a plain tap runs onTap */
function SwipeRow({ actions = [], onTap, inset = 64, children }) {
  const [x, setX] = useState(0);
  const [drag, setDrag] = useState(false);
  const st = useRef(null);
  const W = actions.length * 84;
  const down = (e) => {
    if (e.button != null && e.button !== 0) return;
    /* a press that starts on a button inside the row is that button's tap, but can still become a swipe */
    st.current = { x0: e.clientX, y0: e.clientY, base: x, moved: false, id: e.pointerId, onBtn: !!(e.target.closest && e.target.closest("button")) };
  };
  const move = (e) => {
    const s = st.current;
    if (!s) return;
    const dx = e.clientX - s.x0;
    const dy = e.clientY - s.y0;
    if (!s.moved) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) {
        st.current = null;
        return;
      }
      s.moved = true;
      setDrag(true);
      try {
        e.currentTarget.setPointerCapture(s.id);
      } catch {}
    }
    setX(Math.max(-W - 28, Math.min(0, s.base + dx)));
  };
  const up = () => {
    const s = st.current;
    st.current = null;
    setDrag(false);
    if (!s) return;
    if (!s.moved) {
      if (x !== 0) setX(0);
      else if (onTap && !s.onBtn) onTap();
      return;
    }
    setX((cur) => (cur < -W / 2 ? -W : 0));
  };
  return (
    <div className={"li swipe" + (onTap ? " tap" : "")} style={{ "--inset": inset + "px" }}>
      {x < 0 ? (
        <div className="sw-act">
          {actions.map((a) => (
            <button
              key={a.label}
              style={{ background: a.color }}
              onClick={() => {
                setX(0);
                a.onClick();
              }}
            >
              {a.Icon ? <a.Icon size={20} color="#fff" strokeWidth={2} /> : null}
              {a.label}
            </button>
          ))}
        </div>
      ) : null}
      <div
        className={"sw-row" + (drag ? " drag" : "")}
        style={{ transform: "translateX(" + x + "px)" }}
        onPointerDown={down}
        onPointerMove={move}
        onPointerUp={up}
        onPointerCancel={() => {
          st.current = null;
          setDrag(false);
          setX((cur) => (cur < -W / 2 ? -W : 0));
        }}
        role={onTap ? "button" : undefined}
        tabIndex={onTap ? 0 : undefined}
        onKeyDown={onTap ? (e) => (e.key === "Enter" || e.key === " ") && onTap() : undefined}
      >
        {children}
      </div>
    </div>
  );
}

/* iOS sheet: grabber, round close button, centred title */
/* While any sheet is open the page behind it is frozen: the sheet is
   portalled to <body> (outside the scrolling page), the page's scroller is
   switched off, and touch / wheel movement is only allowed to reach the
   sheet's own scrollable body. */
let openSheets = 0;
function useSheetLock(ovRef, bodyRef) {
  useEffect(() => {
    openSheets += 1;
    document.documentElement.classList.add("sheet-open");
    const ov = ovRef.current;
    const guard = (e) => {
      const b = bodyRef.current;
      const inBody = b && b.contains(e.target);
      if (!inBody || b.scrollHeight <= b.clientHeight + 1) {
        e.preventDefault();
        return;
      }
      if (e.type === "wheel") {
        const atTop = b.scrollTop <= 0 && e.deltaY < 0;
        const atEnd = b.scrollTop + b.clientHeight >= b.scrollHeight - 1 && e.deltaY > 0;
        if (atTop || atEnd) e.preventDefault();
      }
    };
    let startY = 0;
    const onStart = (e) => { if (e.touches && e.touches[0]) startY = e.touches[0].clientY; };
    const onMove = (e) => {
      const b = bodyRef.current;
      if (!b || !b.contains(e.target) || b.scrollHeight <= b.clientHeight + 1) {
        if (!(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
        return;
      }
      const dy = e.touches && e.touches[0] ? e.touches[0].clientY - startY : 0;
      const atTop = b.scrollTop <= 0 && dy > 0;
      const atEnd = b.scrollTop + b.clientHeight >= b.scrollHeight - 1 && dy < 0;
      if (atTop || atEnd) e.preventDefault();
    };
    ov.addEventListener("wheel", guard, { passive: false });
    ov.addEventListener("touchstart", onStart, { passive: true });
    ov.addEventListener("touchmove", onMove, { passive: false });
    return () => {
      ov.removeEventListener("wheel", guard);
      ov.removeEventListener("touchstart", onStart);
      ov.removeEventListener("touchmove", onMove);
      openSheets = Math.max(0, openSheets - 1);
      if (!openSheets) document.documentElement.classList.remove("sheet-open");
    };
  }, []);
}

const PIN_LETTERS = { "2": "ABC", "3": "DEF", "4": "GHI", "5": "JKL", "6": "MNO", "7": "PQRS", "8": "TUV", "9": "WXYZ" };
function PinPad3({ title, subtitle, errorMsg, onComplete, bio }) {
  const [digits, setDigits] = useState("");
  useEffect(() => {
    if (digits.length === 4) {
      const d = digits;
      setDigits("");
      onComplete(d);
    }
  }, [digits, onComplete]);
  const press = (k) => {
    if (k === "del") setDigits((d) => d.slice(0, -1));
    else if (digits.length < 4) setDigits((d) => d + k);
  };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
  return (
    <div className="passcode">
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
        <AppIcon size={56} />
        <div className="pc-title">{title}</div>
        {subtitle ? <div className="pc-sub">{subtitle}</div> : null}
        <div className="dots" aria-label={digits.length + " of 4 digits entered"}>
          {[0, 1, 2, 3].map((i) => (
            <i key={i} className={i < digits.length ? "on" : ""} />
          ))}
        </div>
        <div className="pc-err" role="alert">{errorMsg || ""}</div>
      </div>
      <div className="pc-pad">
        {keys.map((k, i) =>
          k === "" ? (
            bio && bio.available ? (
              <button key={i} className="pc-text" onClick={bio.onUnlock} aria-label={"Use " + bioName}>
                <FaceId size={30} strokeWidth={1.7} />
              </button>
            ) : (
              <div key={i} />
            )
          ) : k === "del" ? (
            <button key={i} className="pc-text" onClick={() => press("del")}>Delete</button>
          ) : (
            <button key={i} className="pc-key" onClick={() => press(k)} aria-label={k}>
              <span>{k}</span>
              <small>{PIN_LETTERS[k] || ""}</small>
            </button>
          )
        )}
      </div>
      <div className="pc-foot">
        {bio && bio.available
          ? bio.unlockError
            ? <span style={{ color: C.red }}>{bio.unlockError}</span>
            : bio.unlocking
            ? "Waiting for the scan…"
            : "Or use " + bioName
          : "Your PIN is kept on this phone only."}
      </div>
    </div>
  );
}

function Onboarding3({ onFinish, onDemo, bio }) {
  const [step, setStep] = useState(0);
  const [draft, setDraft] = useState(blankState());
  const [fxName, setFxName] = useState("");
  const [fxAmt, setFxAmt] = useState("");

  const [wkPhone, setWkPhone] = useState("");
  const [wkDebt, setWkDebt] = useState("");
  const [wkPos, setWkPos] = useState(null);
  const [pinFirst, setPinFirst] = useState(null);
  const [pinErr, setPinErr] = useState("");
  const [bioStep, setBioStep] = useState(false);

  const setCo = (k, v) => setDraft((d) => ({ ...d, company: { ...d.company, [k]: v } }));
  const setSe = (k, v) => setDraft((d) => ({ ...d, season: { ...d.season, [k]: v } }));

  const addFixed = () => {
    if (!fxName.trim() || !Number(fxAmt)) return;
    setDraft((d) => ({
      ...d,
      season: {
        ...d.season,
        fixed: [...d.season.fixed, { id: uid(), name: fxName.trim(), amount: Number(fxAmt) }],
      },
    }));
    setFxName("");
    setFxAmt("");
  };
  const addPosition = () => {
    if (!posName.trim() || !Number(posPay)) return;
    setDraft((d) => ({
      ...d,
      positions: [...d.positions, { id: uid(), name: posName.trim(), pay: Number(posPay) }],
    }));
    setPosName("");
    setPosPay("");
  };
  const addWorker = () => {
    if (!wkName.trim() || !Number(wkUnits)) return;
    setDraft((d) => ({
      ...d,
      workers: [
        ...d.workers,
        {
          id: uid(),
          name: wkName.trim(),
          phone: wkPhone.trim(),
          units: Number(wkUnits),
          positionId: wkPos,
          carriedDebt: Number(wkDebt) || 0,
          loans: [],
          payments: [],
          adjustments: [],
        },
      ],
    }));
    setWkName("");
    setWkUnits("");
    setWkPhone("");
    setWkDebt("");
    setWkPos(null);
  };
  const header = (t, s, n) => (
    <div style={{ padding: "4px 4px 18px" }}>
      {n ? <div className="eyebrow">{n}</div> : null}
      <div className="lt" style={{ marginTop: 2 }}>{t}</div>
      {s ? <div className="lsub" style={{ lineHeight: 1.4, marginTop: 4 }}>{s}</div> : null}
      <div className="prog"><i style={{ width: (step / 5) * 100 + "%" }} /></div>
    </div>
  );
  const back = (to) => (
    <div className="navrow" style={{ padding: "6px 0 0" }}>
      <button className="gbtn glass" onClick={() => setStep(to)} aria-label="Back">
        <ChevronLeft size={20} strokeWidth={2.6} />
      </button>
      <span />
    </div>
  );

  if (bioStep)
    return (
      <div className="onb px">
        <div style={{ paddingTop: "12vh", textAlign: "center" }}>
          <div style={{ color: C.tint, display: "flex", justifyContent: "center" }}>
            <FaceId size={84} strokeWidth={1.5} />
          </div>
          <div className="lt" style={{ fontSize: 28, lineHeight: "34px", marginTop: 22 }}>Use {bioName} to unlock?</div>
          <div className="lsub" style={{ fontSize: 17, lineHeight: 1.45, marginTop: 10, padding: "0 8px" }}>
            {bio.supported
              ? "VaultStack will open with a glance or a touch. Your PIN keeps working if a scan fails."
              : "This phone or browser does not support biometric unlock, so you keep using your PIN."}
          </div>
          <div className="foot center" style={{ marginTop: 14, padding: "0 12px" }}>
            Your PIN is never stored in the unlock record, and face or fingerprint data never leaves your phone.
          </div>
        </div>
        <div className="bottom-actions">
          {bio.supported && bio.error ? (
            <div style={{ color: C.red, fontSize: 15, textAlign: "center", marginBottom: 12 }}>{bio.error}</div>
          ) : null}
          {bio.supported ? (
            <>
              <Btn label={bio.busy ? "Waiting for the scan…" : "Use " + bioName} onClick={() => bio.onEnable(draft)} disabled={bio.busy} />
              <div style={{ height: 8 }} />
            </>
          ) : null}
          <Btn label={bio.supported ? "Not Now" : "Continue"} kind={bio.supported ? "plain" : "primary"} onClick={() => bio.onSkip(draft)} />
        </div>
      </div>
    );

  if (step === 0)
    return (
      <div className="onb">
        <div className="px" style={{ paddingTop: 56, textAlign: "center" }}>
          <AppIcon size={96} />
          <div className="lt" style={{ marginTop: 24, fontSize: 32, lineHeight: "38px" }}>Welcome to VaultStack</div>
          <div className="lsub" style={{ marginTop: 8, lineHeight: 1.45, fontSize: 17, padding: "0 6px" }}>
            The season money book for fishing crews. Works offline and keeps every cedi accounted for.
          </div>
        </div>
        <div className="feats">
          {[
            { Icon: Fish, title: "Log every landing", sub: "Sales and expenses in three taps." },
            { Icon: PeopleLine, title: "Share the pot fairly", sub: "Position pay first, then share units." },

          <div style={{ height: 6 }} />
          <Btn label="Try with Demo Data (PIN 1234)" kind="plain" onClick={onDemo} />

      <PinPad3
        title={pinFirst ? "Enter PIN again" : "Create a 4-digit PIN"}

            ? "Type the same PIN one more time."

        errorMsg={pinErr}
        onComplete={async (d) => {
          if (!pinFirst) {
            setPinFirst(d);
            setPinErr("");
          } else if (d === pinFirst) {
            const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)))
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
            const record = await vsHashPin(d, salt);
            const finalDraft = { ...draft, pin: record, setupDone: true };
            setDraft(finalDraft);
            if (bio && bio.supported) setBioStep(true);
            else onFinish(finalDraft);
          } else {
            setPinFirst(null);
            setPinErr("PINs did not match. Start again.");

    <div className="onb px">
      {step === 1 && (
        <div>
          {back(0)}
          {header("Your Company", "Tell us about your business.", "Step 1 of 5")}
          <div className="group">
            <FormRow label="Company" value={draft.company.name} onChange={(v) => setCo("name", v)} placeholder="Selasi Fishing Co." />
            <FormRow label="Owner" value={draft.company.owner} onChange={(v) => setCo("owner", v)} placeholder="Your name" />
            <FormRow label="Phone" value={draft.company.phone} onChange={(v) => setCo("phone", v)} inputMode="tel" placeholder="024 000 0000" />
          </div>
          <div style={{ height: 24 }} />
          <Btn label="Continue" onClick={() => setStep(2)} disabled={!draft.company.name.trim()} />
        </div>
      )}
      {step === 2 && (
        <div>
          {back(1)}
          {header("Positions", "Roles that earn standing pay each season. You can skip this.", "Step 2 of 5")}
          {draft.positions.length > 0 && (
            <div className="group" style={{ marginBottom: 8 }}>
              {draft.positions.map((p) => (
                <KV key={p.id} k={p.name} v={fmt(p.pay) + " / season"} muted />
              ))}
            </div>
          )}
          <div className="caps" style={{ paddingTop: 12 }}>Add a position</div>
          <div className="group">
            <FormRow label="Name" value={posName} onChange={setPosName} placeholder="Bosun" />
            <FormRow label="Pay (GH₵)" value={posPay} onChange={(v) => setPosPay(v.replace(/[^\d.]/g, ""))} inputMode="decimal" placeholder="0" />
          </div>
          <div style={{ height: 12 }} />
          <Btn label={<><Plus size={18} strokeWidth={2.4} /> Add Position</>} kind="ghost" small onClick={addPosition} />
          <div style={{ height: 24 }} />
          <Btn label="Continue" onClick={() => setStep(3)} />
        </div>
      )}
      {step === 3 && (
        <div>
          {back(2)}
          {header("Fixed Expenses", "Costs for the whole season, paid before sharing.", "Step 3 of 5")}
          {draft.season.fixed.length > 0 && (
            <div className="group" style={{ marginBottom: 8 }}>
              {draft.season.fixed.map((f) => (
                <KV key={f.id} k={f.name} v={fmt(f.amount)} muted />
              ))}
            </div>
          )}
          <div className="caps" style={{ paddingTop: 12 }}>Add an expense</div>
          <div className="group">
            <FormRow label="Name" value={fxName} onChange={setFxName} placeholder="Net repairs" />
            <FormRow label="Amount (GH₵)" value={fxAmt} onChange={(v) => setFxAmt(v.replace(/[^\d.]/g, ""))} inputMode="decimal" placeholder="0" />
          </div>
          <div style={{ height: 12 }} />
          <Btn label={<><Plus size={18} strokeWidth={2.4} /> Add Expense</>} kind="ghost" small onClick={addFixed} />
          <div style={{ height: 24 }} />
          <Btn label="Continue" onClick={() => setStep(4)} />
        </div>
      )}
      {step === 4 && (
        <div>
          {back(3)}
          {header("Workers & Shares", "Give each worker share units, and a position if they hold one.", "Step 4 of 5")}
          {draft.workers.length > 0 && (
            <div className="group" style={{ marginBottom: 8 }}>
              {draft.workers.map((w) => {
                const p = draft.positions.find((x) => x.id === w.positionId);
                return (
                  <Item key={w.id} inset={68}>
                    <RowBody
                      lead={<Mono name={w.name} />}
                      title={w.name}
                      sub={(p ? p.name + " · " : "") + w.units + " units" + (w.carriedDebt ? " · owes " + fmt(w.carriedDebt) : "")}
                    />
                  </Item>
                );
              })}
            </div>
          )}
          <div className="caps" style={{ paddingTop: 12 }}>Add a worker</div>
          <div className="group">
            <FormRow label="Name" value={wkName} onChange={setWkName} placeholder="Kofi" />
            <FormRow label="Share units" value={wkUnits} onChange={(v) => setWkUnits(v.replace(/[^\d.]/g, ""))} inputMode="decimal" placeholder="0" />
            <FormRow label="Phone" value={wkPhone} onChange={setWkPhone} inputMode="tel" placeholder="Optional" />
            <FormRow label="Old debt (GH₵)" value={wkDebt} onChange={(v) => setWkDebt(v.replace(/[^\d.]/g, ""))} inputMode="decimal" placeholder="0" />
          </div>
          {draft.positions.length > 0 && (
            <div>
              <div className="caps" style={{ paddingTop: 16 }}>Position</div>
              <div className="chips" style={{ justifyContent: "flex-start", marginTop: 0 }}>
                <button className={"chip" + (wkPos === null ? " on" : "")} onClick={() => setWkPos(null)}>None</button>
                {draft.positions.map((p) => (
                  <button key={p.id} className={"chip" + (wkPos === p.id ? " on" : "")} onClick={() => setWkPos(p.id)}>
                    {p.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          <div style={{ height: 14 }} />
          <Btn label={<><Plus size={18} strokeWidth={2.4} /> Add Worker</>} kind="ghost" small onClick={addWorker} />
          <div style={{ height: 24 }} />
          <Btn label="Continue" onClick={() => setStep(5)} disabled={draft.workers.length === 0} />
        </div>
      )}
      {step === 5 && (
        <div>
          {back(4)}
          {header("Season Start", "When does this season begin?", "Step 5 of 5")}
          <div className="group">
            <FormRow label="Season" value={draft.season.name} onChange={(v) => setSe("name", v)} placeholder="Major Season 2026" />
            <FormRow label="Start date" type="date" value={draft.season.start} onChange={(v) => setSe("start", v)} />
          </div>
          <div style={{ height: 24 }} />
          <Btn label="Continue" onClick={() => setStep(6)} disabled={!draft.season.name.trim()} />
        </div>
      )}
      <div style={{ height: "calc(28px + env(safe-area-inset-bottom, 0px))" }} />
    </div>
  );
}

/* ---------------- app shell ---------------- */
function VaultStackV3() {
  const [state, setState] = useState(null);
  const [locked, setLocked] = useState(false);
  const [pinErr, setPinErr] = useState("");
  const [tab, setTab] = useState("home");
  const [flow, setFlow] = useState(null);
  const [expCat, setExpCat] = useState(null);
  const [expSession, setExpSession] = useState([]);
  const [newCatName, setNewCatName] = useState("");
  const [payCust, setPayCust] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [saveStamp, setSaveStamp] = useState(null);
  const [bioSupported, setBioSupported] = useState(false);
  const [bioEnrolled, setBioEnrolled] = useState(false);
  const [bioUnlocking, setBioUnlocking] = useState(false);
  const [bioError, setBioError] = useState("");
  const [bioBusy, setBioBusy] = useState(false); /* p1400 */
  const saveTimer = useRef(null);
  const toastTimer = useRef(null);
  const firstRender = useRef(true);
  const [pinMode, setPinMode] = useState(false);
  const [menu, setMenu] = useState(null);
  const scrollRef = useRef(null);
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    setMenu(null);
  }, [tab]);
  useEffect(() => {
    if (locked) setPinMode(false);
  }, [locked]);

  useEffect(() => {
    (async () => {
      const saved = normalizeState(await loadSaved());
      if (saved && saved.setupDone) {
        setState(saved);
        setLocked(Boolean(saved.pin));
      } else {
        setState(saved || blankState());
      }
    })();
  }, []);

  useEffect(() => {
    vsBioSupported().then((s) => {
      setBioSupported(s);
      if (s) {
        try {
          setBioEnrolled(Boolean(localStorage.getItem(VS_BIO_KEY)));
        } catch {
          setBioEnrolled(false);
        }
      }
    });
  }, []);

  useEffect(() => {
    if (state === null) return;
    if (firstRender.current) {
      firstRender.current = false;
      return;
    }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStamp("saving");
    saveTimer.current = setTimeout(async () => {
      const ok = await persist(state);
      setSaveStamp(ok ? new Date() : "error");
    }, 450);
    return () => saveTimer.current && clearTimeout(saveTimer.current);
  }, [state]);

  const toast = (msg) => {
    setToastMsg(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2000);
  };

  const fin = useMemo(() => (state ? computeFinancials(state) : null), [state]);

  if (state === null)
    return (
      <div style={{ fontFamily: baseFont, padding: 40, textAlign: "center", color: MUTED }}>
        Opening VaultStack…
      </div>
    );

  const doBioUnlock = async () => {
    if (bioUnlocking) return;
    setBioUnlocking(true);
    setBioError("");
    try {
      await vsBioUnlock();
      setLocked(false);
    } catch (e) {
      setBioError(e && e.message ? e.message : "Unlock failed. Use your PIN.");
    } finally {
      setBioUnlocking(false);
    }
  };

  const addSale = (s) => setState((st) => ({ ...st, sales: [...st.sales, s] }));
  const addRecordPayment = (saleId, pay) =>
    setState((st) => ({
      ...st,
      sales: st.sales.map((x) =>
        x.id === saleId ? { ...x, payments: [...(x.payments || []), pay] } : x
      ),
    }));
  const clearCustomerDebt = (customerName) =>
    setState((st) => {
      let changed = false;
      const sales = st.sales.map((x) => {
        if ((x.customer || "").trim().toLowerCase() !== customerName.toLowerCase()) return x;
        const due = Math.max(0, (Number(x.amount) || 0) - salePaid(x));
        if (due <= 0) return x;
        changed = true;
        return { ...x, payments: [...(x.payments || []), { id: uid(), date: todayISO(), amount: due }] };
      });
      return changed ? { ...st, sales } : st;
    });
  const addExpense = (e) => setState((st) => ({ ...st, expenses: [...st.expenses, e] }));
  const removeSale = (id) => setState((st) => ({ ...st, sales: st.sales.filter((x) => x.id !== id) }));
  const removeExpense = (id) => setState((st) => ({ ...st, expenses: st.expenses.filter((x) => x.id !== id) }));
  const addLoan = (wid, loan) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: [...w.loans, loan] } : w)),
    }));
  const addPayment = (wid, pay) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: [...w.payments, pay] } : w)),
    }));
  const addAdjustment = (wid, adj) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: [...w.adjustments, adj] } : w)),
    }));
  const removeLoan = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: w.loans.filter((x) => x.id !== id) } : w)),
    }));
  const removePayment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: w.payments.filter((x) => x.id !== id) } : w)),
    }));
  const removeAdjustment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: w.adjustments.filter((x) => x.id !== id) } : w)),
    }));
  const resolveCategory = (raw) => {
    const name = raw.trim();
    const existing = state.expenseCats.find((c) => c.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    setState((st) => ({ ...st, expenseCats: [...st.expenseCats, name] }));
    return name;
  };
  const closeSeason = () =>
    setState((st) => {
      const f = computeFinancials(st);
      const settlements = st.workers.map((w) => {
        const k = workerNumbers(st, w, f);
        return { name: w.name, payout: k.payout };
      });
      const nextYear = new Date().getFullYear();
      return {
        ...st,
        pastSeasons: [
          ...st.pastSeasons,
          { name: st.season.name, netPot: f.netPot, settlements },
        ],
        season: { ...st.season, name: "New Season " + nextYear, start: todayISO() },
        sales: [],
        expenses: [],
        workers: st.workers.map((w) => {
          const k = workerNumbers(st, w, f);
          return { ...w, carriedDebt: k.payout < 0 ? -k.payout : 0, loans: [], payments: [], adjustments: [] };
        }),
      };
    });
  const resetAll = async () => {
    await wipeSaved();
    try {
      localStorage.removeItem(VS_BIO_KEY);
    } catch {}
    setBioEnrolled(false);
    firstRender.current = true;
    setState(blankState());
    setLocked(false);
    setTab("home");
    setFlow(null);
  };
  const shell = (children) => <div className="vs-shell">{children}</div>;

  if (!state.setupDone)
    return shell(
      <div className="vs-scroll">
        <Onboarding3
          onFinish={(d) => {
            setState(d);
            setTab("home");
          }}
          onDemo={() => {
            setState(demoState());
            setLocked(true);
          }}
          bio={{
            supported: bioSupported,
            busy: bioBusy,
            error: bioError,
            onEnable: async (d) => {
              setBioBusy(true);
              setBioError("");
              try {
                await vsBioEnroll();
                setBioEnrolled(true);
                setState(d);
                setTab("home");
              } catch (e) {
                setBioError(e && e.message ? e.message : "Could not set up biometric unlock. You can use your PIN.");
              } finally {
                setBioBusy(false);
              }
            },
            onSkip: (d) => {
              setState(d);
              setTab("home");
            },
          }}
        />
      </div>
    );

  if (locked)
    return shell(
      bioSupported && bioEnrolled && !pinMode ? (
        <LockScreen
          company={state.company.name}
          onUnlock={doBioUnlock}
          unlocking={bioUnlocking}
          error={bioError}
          onPin={() => setPinMode(true)}
        />
      ) : (
        <PinPad3
          title="Enter your PIN"
          subtitle={state.company.name}
          errorMsg={pinErr}
          onComplete={async (d) => {
            if (await vsVerifyPin(d, state.pin)) {
              setLocked(false);
              setPinErr("");
              /* quietly upgrade old plain PIN records to the salted format */
              if (!vsPinIsSalted(state.pin)) {
                try {
                  const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)))
                    .map((b) => b.toString(16).padStart(2, "0"))
                    .join("");
                  const record = await vsHashPin(d, salt);
                  setState((st) => ({ ...st, pin: record }));
                } catch {}
              }
            } else {
              setPinErr("Wrong PIN. Try again.");
            }
          }}
          bio={
            bioSupported && bioEnrolled
              ? { available: true, onUnlock: doBioUnlock, unlockError: bioError, unlocking: bioUnlocking }
              : { available: false }
          }
        />
      )
    );

  const tabs = [
    { id: "home", Icon: TabHome, IconOn: TabHomeOn, label: "Home" },
    { id: "sales", Icon: TabSales, IconOn: TabSalesOn, label: "Sales" },
    { id: "expenses", Icon: TabExpenses, IconOn: TabExpensesOn, label: "Expenses" },
    { id: "workers", Icon: TabWorkers, IconOn: TabWorkersOn, label: "Workers" },
    { id: "more", Icon: TabMore, IconOn: TabMoreOn, label: "More" },
  ];
  const activeTab = tab === "weather" ? "more" : tab;
  const sky = tab === "weather";

  const openSale = () => setFlow("sale");
  const openExpense = () => {
    setExpSession([]);
    setFlow("expense-cat");
  };
  const lock = () => {
    setFlow(null);
    setLocked(true);
  };

  const availableCats = state.expenseCats.filter(
    (c) => !expSession.some((s) => s.cat.toLowerCase() === c.toLowerCase())
  );
  const sessionTotal = expSession.reduce((s, x) => s + x.amount, 0);
  return shell(
    <>
      <div className="vs-scroll" ref={scrollRef}>
        {tab === "home" && (
          <HomeTabV2
            state={state}
            fin={fin}
            openSale={openSale}
            openExpense={openExpense}
            go={setTab}
            onLock={lock}
            saveStamp={saveStamp}
            onMenu={() => setMenu("me")}
          />
        )}
        {tab === "sales" && (
          <SalesTab
            state={state}
            fin={fin}
            openSale={openSale}
            removeSale={removeSale}
            onRecordPayment={(c) => {
              setPayCust(c);
              setFlow("pay");
            }}
            onClearCustomer={clearCustomerDebt}
            toast={toast}
          />
        )}
        {tab === "expenses" && (
          <ExpensesTab
            state={state}
            fin={fin}
            openExpense={openExpense}
            removeExpense={removeExpense}
            toast={toast}
          />
        )}
        {tab === "workers" && (
          <WorkersTabV2
            state={state}
            fin={fin}
            addLoan={addLoan}
            addPayment={addPayment}
            addAdjustment={addAdjustment}
            removeLoan={removeLoan}
            removePayment={removePayment}
            removeAdjustment={removeAdjustment}
            toast={toast}
          />
        )}
        {tab === "weather" && <WeatherTabV2 onBack={() => setTab("more")} />}
        {tab === "more" && (
          <MoreTabV2
            state={state}
            fin={fin}
            onCloseSeason={closeSeason}
            onReset={resetAll}
            onLock={lock}
            go={setTab}
            bio={{
              supported: bioSupported,
              enrolled: bioEnrolled,
              busy: bioBusy,
              onEnable: async () => {
                setBioBusy(true);
                setBioError("");
                try {
                  await vsBioEnroll();
                  setBioEnrolled(true);
                  toast("Face / fingerprint unlock is on");
                } catch (e) {
                  setBioError(e && e.message ? e.message : "Could not turn on biometric unlock.");
                  toast("Could not set up unlock. Use your PIN.");
                } finally {
                  setBioBusy(false);
                }
              },
              onDisable: () => {
                try {
                  localStorage.removeItem(VS_BIO_KEY);
                } catch {}
                setBioEnrolled(false);
                toast("Face / fingerprint unlock is off");
              },
            }}
          />
        )}
      </div>

      {!sky && <div className="edgefade" />}

      <nav className={"tabbar " + (sky ? "glass-sky" : "glass")} aria-label="Sections">
        {tabs.map(({ id, Icon, IconOn, label }) => {
          const on = activeTab === id;
          const I = on ? IconOn : Icon;
          return (
            <button
              key={id}
              className={"tab" + (on ? " on" : "")}
              aria-current={on ? "page" : undefined}
              onClick={() => {
                setTab(id);
                setFlow(null);
              }}
            >
              <I size={25} strokeWidth={on ? 2.1 : 1.7} />
              {label}
            </button>
          );
        })}
      </nav>
      <button className={"fab " + (sky ? "glass-sky" : "glass")} onClick={() => setMenu("add")} aria-label="Log a sale or expense">
        <Plus size={26} strokeWidth={2.6} />
      </button>

      {menu === "add" && (
        <PopMenu
          onClose={() => setMenu(null)}
          style={{ right: 12, bottom: "calc(max(env(safe-area-inset-bottom, 0px), 20px) + 66px)" }}
          items={[
            { label: "New Sale", Icon: Fish, onClick: openSale },
            { label: "New Expense", Icon: Package, onClick: openExpense },
          ]}
        />
      )}
      {menu === "me" && (
        <PopMenu
          onClose={() => setMenu(null)}
          style={{ right: 16, top: 76 }}
          items={[
            { label: "Lock Now", Icon: Lock, onClick: lock },
            { label: "Settings", Icon: Settings, onClick: () => setTab("more") },
          ]}
        />
      )}

      {toastMsg && (
        <div className="toast" role="status">
          <Check size={17} color="#30D158" strokeWidth={3} />
          <span className="truncate">{toastMsg}</span>
        </div>
      )}

      {flow === "sale" && (
        <SaleSheet
          onClose={() => setFlow(null)}
          onDone={({ amount, customer, paid, date }) => {
            addSale({
              id: uid(),
              date,
              amount,
              note: "",
              customer,
              paid,
              payments: [],
              createdAt: new Date().toISOString(),
            });
            setFlow(null);
            const due = Math.max(0, amount - paid);
            toast(
              due > 0.004
                ? "Sale saved · " + fmt(due) + " in credit" + (customer ? " for " + customer : "")
                : "Sale saved · " + fmt(amount)
            );
          }}
        />
      )}

      {flow === "pay" && payCust && (
        <RecordPaymentSheet
          credit={payCust}
          onClose={() => {
            setFlow(null);
            setPayCust(null);
          }}
          onDone={({ amount, date }) => {
            const name = payCust.name;
            let left = amount;
            /* spread the payment across that customer's open sales, oldest first */
            const targets = state.sales
              .filter((x) => (x.customer || "").trim().toLowerCase() === name.toLowerCase())
              .filter((x) => saleOutstanding(x) > 0.004)
              .sort((a, b) => (a.date < b.date ? -1 : 1));
            targets.forEach((t) => {
              if (left <= 0.004) return;
              const take = Math.min(left, saleOutstanding(t));
              addRecordPayment(t.id, { id: uid(), date, amount: take });
              left -= take;
            });
            setFlow(null);
            setPayCust(null);
            toast("Payment saved · " + fmt(amount));
          }}
        />
      )}
      {flow === "expense-cat" && (
        <Modal title="New Expense" onClose={() => setFlow(null)}>
          <div className="lsub" style={{ textAlign: "center", margin: "0 0 14px" }}>What did you pay for?</div>
          <div className="catgrid">
            {availableCats.map((name) => {
              const Icon = catIcon(name);
              return (
                <button
                  key={name}
                  className="cat vs-press"
                  onClick={() => {
                    setExpCat(name);
                    setFlow("expense-amt");
                  }}
                >
                  <Sq Icon={Icon} color={catColor(name)} size={32} />
                  <span>{name}</span>
                </button>
              );
            })}
            <button
              className="cat vs-press"
              onClick={() => {
                setNewCatName("");
                setFlow("expense-name");
              }}
            >
              <Sq Icon={Plus} color="#8E8E93" size={32} />
              <span style={{ color: C.tint }}>Other…</span>
            </button>
          </div>

          {expSession.length > 0 && (
            <div>
              <div className="sh" style={{ paddingTop: 22 }}><b style={{ fontSize: 20 }}>Logged Just Now</b></div>
              <div className="group g2">
                {expSession.map((s, i) => (
                  <div key={i} className="li vrow sm" style={{ "--inset": "44px" }}>
                    <Check size={18} color={C.green} strokeWidth={3} />
                    <div className="tx" style={{ fontSize: 17, letterSpacing: "-.02em" }}>{s.cat}</div>
                    <div className="am">{"−" + fmtN(s.amount)}</div>
                  </div>
                ))}
                <KV k="Total this sitting" v={"−" + fmtN(sessionTotal)} strong />
              </div>
              <div style={{ height: 16 }} />
              <Btn
                label="Done"
                onClick={() => {
                  setFlow(null);
                  setTab("expenses");
                }}
              />
            </div>
          )}
        </Modal>
      )}

      {flow === "expense-name" && (
        <Modal title="New Category" onClose={() => setFlow("expense-cat")}>
          <div className="lsub" style={{ textAlign: "center", margin: "0 8px 16px", lineHeight: 1.4 }}>
            Give it a name once. It will be saved as a button for next time.
          </div>
          <div className="group g2">

/* ---------------- sea conditions ---------------- */
function useSea() {
  const [wx, setWx] = useState({ status: "loading" });
  useEffect(() => {
    let alive = true;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    (async () => {
      try {
        const [mr, fr] = await Promise.all([
          fetch(
            "https://marine-api.open-meteo.com/v1/marine?" + SEA_POINT + "&current=wave_height",
            { signal: ctrl.signal }
          ),
          fetch(
            "https://api.open-meteo.com/v1/forecast?" + SEA_POINT + "&current=wind_speed_10m,precipitation&wind_speed_unit=kmh",
            { signal: ctrl.signal }
          ),
        ]);
        const mj = await mr.json();
        const fj = await fr.json();
        if (!alive) return;
        setWx({
          status: "live",
          wave: mj.current?.wave_height ?? 0,
          wind: fj.current?.wind_speed_10m ?? 0,
          rain: fj.current?.precipitation ?? 0,
        });
      } catch {
        if (!alive) return;
        setWx({ status: "demo", wave: 0.9, wind: 14, rain: 0 });
      } finally {
        clearTimeout(t);
      }
    })();
    return () => {
      alive = false;
      ctrl.abort();
      clearTimeout(t);
    };
  }, []);
  return wx;
}

function seaVerdict(wx) {
  if (!wx || wx.status === "loading") return { label: "CHECKING", col: NAVY, msg: "" };
  return wx.wave >= 2 || wx.wind >= 30
    ? { label: "STAY ASHORE", col: BAD, msg: "The sea is dangerous today. Do not go out." }
    : wx.wave >= 1.2 || wx.wind >= 20 || wx.rain >= 2
    ? { label: "CAUTION", col: WARN, msg: "Conditions are rough. Go carefully or wait." }
    : { label: "SAFE", col: GOOD, msg: "Good conditions for fishing today." };
}
const SKY = {
  SAFE: "radial-gradient(circle at 82% 4%,rgba(255,255,255,.42),rgba(255,255,255,0) 30%),linear-gradient(180deg,#2466A8 0%,#3988CB 36%,#62ACDF 70%,#94CDEE 100%)",
  CAUTION: "radial-gradient(circle at 82% 4%,rgba(255,236,200,.35),rgba(255,255,255,0) 30%),linear-gradient(180deg,#3A5A82 0%,#5F82A8 40%,#A99A86 75%,#D9A566 100%)",
  "STAY ASHORE": "linear-gradient(180deg,#26303C 0%,#3B4755 40%,#55616E 75%,#6F7A85 100%)",
};
const SKY_WORD = { SAFE: "Safe", CAUTION: "Caution", "STAY ASHORE": "Stay Ashore", CHECKING: "Checking" };
/* where today's reading sits on the green-to-red go/no-go scale */
function seaScalePos(wx) {
  if (!wx || wx.status === "loading") return 3;
  const band = (v, a, b) => (v < a ? (v / a) * 33 : v < b ? 33 + ((v - a) / (b - a)) * 33 : 66 + Math.min(1, (v - b) / b) * 30);
  let p = Math.max(band(Number(wx.wave) || 0, 1.2, 2), band(Number(wx.wind) || 0, 20, 30));
  if ((Number(wx.rain) || 0) >= 2) p = Math.max(p, 40);
  return Math.max(3, Math.min(97, p));
}

/* -------- new sale: an Apple Cash-style amount sheet -------- */
function SaleSheet({ onClose, onDone }) {
  const [total, setTotal] = useState("");
  const [cust, setCust] = useState("");
  const [showCust, setShowCust] = useState(false);
  const [mode, setMode] = useState("full");
  const [part, setPart] = useState("");
  const [date, setDate] = useState(todayISO());

  const amt = Number(total) || 0;
  const paidAmt = mode === "full" ? amt : mode === "credit" ? 0 : Math.min(Number(part) || 0, amt);
  const due = Math.max(0, amt - paidAmt);
  const pressKey = (k, setter) => {
    if (k === "del") return setter((v) => v.slice(0, -1));
    setter((v) => {
      if (k === "." && v.includes(".")) return v;
      if (v.includes(".") && v.split(".")[1].length >= 2) return v;
      if (v.replace(".", "").length >= 8) return v;
      if (v === "" && k === ".") return "0.";
      if (v === "0" && k !== ".") return k;
      return v + k;
    });
  };

  return (
    <Modal title="New Sale" onClose={onClose}>
      <AmountBig value={total} />
      <div className="lsub center" style={{ marginTop: 8 }}>Total for this landing</div>
      <div className="chips">
        <DateChip date={date} setDate={setDate} />
        <button className={"chip" + (cust.trim() ? " on" : "")} onClick={() => setShowCust((v) => !v)}>
          <PersonCircle size={17} strokeWidth={2} />
          {cust.trim() ? cust.trim() : "Add Customer"}
        </button>
      </div>
      {showCust ? (
        <div className="group g2" style={{ marginTop: 14 }}>
          <FormRow label="Customer" value={cust} onChange={setCust} placeholder="Ama" autoFocus />
        </div>
      ) : null}
      <div style={{ marginTop: 18 }}>
        <Seg options={[["full", "Paid in Full"], ["part", "Part Paid"], ["credit", "On Credit"]]} value={mode} onChange={setMode} />
      </div>
      {mode === "part" ? (
        <div className="group g2" style={{ marginTop: 12 }}>
          <FormRow label="Cash received now" value={part} onChange={(v) => setPart(v.replace(/[^0-9.]/g, ""))} placeholder="0" inputMode="decimal" />
        </div>
      ) : null}
      <div className="kmsg" style={{ color: due > 0.004 ? C.orangeT : C.sec }}>
        {amt <= 0
          ? " "
          : due > 0.004
          ? fmt(due) + " will be owed" + (cust.trim() ? " by " + cust.trim() : " · add a customer to track it")
          : "Paid in full"}
      </div>
      <Keypad onKey={(k) => pressKey(k, setTotal)} />
      <div style={{ height: 10 }} />
      <Btn
        label={"Save Sale" + (amt ? " · " + fmt(amt) : "")}
        disabled={!amt}
        onClick={() => onDone({ amount: amt, customer: cust.trim(), paid: paidAmt, date })}
      />
    </Modal>
  );
}
