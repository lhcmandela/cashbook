  const over = amt > credit.owed + 0.004;
  const remaining = Math.max(0, credit.owed - amt);
  const half = Math.round((credit.owed / 2) * 100) / 100;
  const pressR = (k) =>
    k === "del"
      ? setVal((v) => v.slice(0, -1))
      : setVal((v) => {
          if (k === "." && v.includes(".")) return v;
          if (v.includes(".") && v.split(".")[1].length >= 2) return v;
          if (v.replace(".", "").length >= 8) return v;
          if (v === "" && k === ".") return "0.";
          if (v === "0" && k !== ".") return k;
          return v + k;
        });

  return (
    <Modal title={"Payment from " + credit.name} onClose={onClose}>
      <AmountBig value={val} color={over ? C.red : undefined} />
      <div className="lsub center" style={{ marginTop: 8 }}>
        Owes {fmt(credit.owed)} · {credit.sales.length} {credit.sales.length === 1 ? "sale" : "sales"}
      </div>
      <div className="chips">
        <DateChip date={date} setDate={setDate} />
        <button className={"chip" + (val === String(credit.owed) ? " on" : "")} onClick={() => setVal(String(credit.owed))}>
          Full {fmtN(credit.owed)}
        </button>
        <button className={"chip" + (val === String(half) ? " on" : "")} onClick={() => setVal(String(half))}>
          Half {fmtN(half)}
        </button>
      </div>
      <div className="kmsg" style={{ color: over ? C.red : C.sec }}>
        {over ? "More than they owe." : amt > 0 ? (remaining <= 0.004 ? "This clears the credit." : "Still owed after this: " + fmt(remaining)) : " "}
      </div>
      <Keypad onKey={pressR} />
      <div style={{ height: 10 }} />
      <Btn
        label={"Record Payment" + (amt > 0 ? " · " + fmt(amt) : "")}
        disabled={!amt || over}
        onClick={() => onDone({ amount: amt, date })}
      />
    </Modal>
  );
}

/* ---------------- Expenses ---------------- */
function ExpensesTab({ state, fin, openExpense, removeExpense, toast }) {
  const [del, setDel] = useState(null);
  const total = fin.fixedTotal + fin.varTotal;

  const byCat = useMemo(() => {
    const map = {};
    state.expenses.forEach((e) => {
      const c = e.category || "Other";
      map[c] = (map[c] || 0) + (Number(e.amount) || 0);
    });
    return Object.keys(map)
      .map((c) => ({ cat: c, total: map[c] }))
      .sort((a, b) => b.total - a.total);
  }, [state.expenses]);

  const grouped = useMemo(() => {
    const byDate = {};
    state.expenses.forEach((e) => {
      (byDate[e.date] = byDate[e.date] || []).push(e);
    });
    const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));
    return { dates, byDate };
  }, [state.expenses]);
  return (
    <div>
      <TitleBlock
        title="Expenses"
        sub={(state.season.name || "This season") + " · " + (state.expenses.length + state.season.fixed.length) + " entries"}
      />
      <div className="px">
        <div className="card sum">
          <BigSum label="Total spent this season" amount={total} />
          <Stack
            parts={[
              { key: "fixed", value: fin.fixedTotal, color: C.tint },
              { key: "trip", value: fin.varTotal, color: C.orange },
            ]}
          />
          <Legend
            items={[
              { label: "Fixed costs", color: C.tint, value: fmtN(fin.fixedTotal) },
              { label: "Trip costs", color: C.orange, value: fmtN(fin.varTotal) },
            ]}
          />
        </div>

        {state.season.fixed.length > 0 ? (
          <div>
            <Head title="Fixed Costs" />
            <div className="group">
              {state.season.fixed.map((f) => (
                <KV key={f.id} k={f.name} v={fmtN(f.amount)} />
              ))}
              <KV k="Total fixed" v={fmtN(fin.fixedTotal)} strong />
            </div>
          </div>
        ) : null}

        {byCat.length > 0 ? (
          <div>
            <Head title="By Category" />
            <div className="group">
              {byCat.map((c) => (
                <Item key={c.cat}>
                  <RowBody
                    lead={<Sq Icon={catIcon(c.cat)} color={catColor(c.cat)} />}
                    title={c.cat}
                    sub={total > 0 ? Math.round((c.total / total) * 100) + "% of all spending" : ""}
                    right={<div className="am">{fmtN(c.total)}</div>}
                  />
                </Item>
              ))}
            </div>
          </div>
        ) : null}

        <Head title="All Expenses" />
        {state.expenses.length === 0 ? (
          <div className="card empty">
            Nothing recorded yet. Log premix, food, ice or repairs when you pay for them.
            <div style={{ height: 12 }} />
            <Btn label={<><Plus size={18} strokeWidth={2.4} /> Log an Expense</>} small onClick={openExpense} />
          </div>
        ) : (
          grouped.dates.map((d, di) => (
            <div key={d} style={{ marginBottom: 14 }}>
              <div className="caps" style={{ paddingTop: di === 0 ? 0 : 4 }}>{fmtDate(d)}</div>
              <div className="group">
                {grouped.byDate[d].map((e) => (
                  <SwipeRow
                    key={e.id}
                    onTap={() => setDel(e)}
                    actions={[{ label: "Delete", Icon: Trash2, color: "#FF3B30", onClick: () => setDel(e) }]}
                  >
                    <RowBody
                      lead={<Sq Icon={catIcon(e.category)} color={catColor(e.category)} />}
                      title={e.category || "Expense"}
                      sub={e.note ? e.note : fmtDate(e.date)}
                      right={<div className="am">{"−" + fmtN(e.amount)}</div>}
                    />
                  </SwipeRow>
                ))}
              </div>
            </div>
          ))
        )}
        {state.expenses.length > 0 ? <div className="foot" style={{ paddingTop: 0 }}>Swipe left on an expense to delete it.</div> : null}
      </div>
      <Spacer />

      {del && (
        <ConfirmRemove
          title={del.category || "Expense"}
          amount={fmt(del.amount)}
          lines={[fmtDate(del.date) + (del.note ? " · " + del.note : "")]}
          confirmLabel="Delete Expense"
          onClose={() => setDel(null)}
          onConfirm={() => {
            removeExpense(del.id);
            setDel(null);
            toast("Expense removed");
          }}
        />
      )}
    </div>
  );
}

  const [openId, setOpenId] = useState(null);
  const [sub, setSub] = useState(null);

  const [goodsOther, setGoodsOther] = useState("");
  const [adjKind, setAdjKind] = useState("deduction");
  const [adjReason, setAdjReason] = useState("");
  const [adjOther, setAdjOther] = useState("");
  const [copied, setCopied] = useState(false);
  const [del, setDel] = useState(null);

  const w = state.workers.find((x) => x.id === openId) || null;
  const n = w ? workerNumbers(state, w, fin) : null;
  const posName = w && w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;

  const histRows = w
    ? [
        ...w.loans.map((l) => ({ ...l, k: "loan" })),
        ...w.payments.map((p) => ({ ...p, k: "pay" })),
        ...w.adjustments.map((a) => ({ ...a, k: "adj" })),
      ].sort((a, b) => (a.date < b.date ? 1 : -1))
    : [];

  const histLabel = (h) => {
    if (h.k === "loan") return "Loan";
    if (h.k === "pay") return h.desc || "Payment";
    return (h.kind === "bonus" ? "Bonus" : "Deduction") + (h.reason ? " · " + h.reason : "");
  };
  const histAmount = (h) =>
    h.k === "adj" && h.kind === "bonus" ? "+ " + fmt(h.amount) : "\u2212 " + fmt(h.amount);

  const crewTotal = state.workers.reduce((s, wk) => {
    const k = workerNumbers(state, wk, fin);
    return s + Math.max(0, k.payout);
  }, 0);
  const crewDebt = state.workers.reduce((s, wk) => {
    const k = workerNumbers(state, wk, fin);
    return s + Math.max(0, -k.payout);
  }, 0);
  useEffect(() => {
    const sc = document.querySelector(".vs-scroll");
    if (sc) sc.scrollTop = 0;
  }, [openId]);
  const openAdj = (kind) => {
    setAdjKind(kind);
    setAdjReason("");
    setAdjOther("");
    setSub("adj-reason");
  };

  return (

        <div>
          <TitleBlock title="Workers" sub={state.workers.length + " in the crew · " + fin.totalUnits + " share units"} />

            {state.workers.length === 0 ? (
              <div className="card empty">No workers on this season yet.</div>

              <div className="group">
                {state.workers.map((wk) => {
                  const k = workerNumbers(state, wk, fin);
                  const pn = wk.positionId ? (state.positions.find((p) => p.id === wk.positionId) || {}).name : null;
                  const heavy = k.loansTotal + k.carried > k.grossShare * 0.7;
                  return (
                    <Item
                      key={wk.id}
                      inset={68}
                      onClick={() => {
                        setOpenId(wk.id);
                        setSub(null);
                        setCopied(false);

                    >
                      <RowBody
                        lead={<Mono name={wk.name} />}
                        title={wk.name}
                        sub={(pn ? pn + " · " : "") + wk.units + " units"}
                        right={
                          <div style={{ textAlign: "right" }}>
                            <div className="am" style={{ fontWeight: 600, color: k.payout < 0 ? C.red : C.label }}>{fmtN(k.payout)}</div>
                            <div style={{ fontSize: 13, marginTop: 1, color: k.payout < 0 ? C.red : heavy ? C.orangeT : C.sec }}>

          title={"Payment to " + w.name}
          HeaderIcon={payDesc === "Cash" ? Banknote : Package}
          subtitle={payDesc === "Cash" ? "Cash payment" : payDesc + " — agreed value"}
          quick={[20, 50, 100]}
          confirmLabel="Save payment"
          onClose={() => setSub("pay-type")}
          onSave={({ amount, date }) => {
            addPayment(w.id, {
              id: uid(),
              date,
              type: payDesc === "Cash" ? "cash" : "goods",
              amount,
              desc: payDesc,
            });
            setSub(null);
            toast("Payment saved · " + fmt(amount));
          }}
        />
      )}
      {w && sub === "adj-reason" && (
        <Modal title={adjKind === "bonus" ? "Bonus for " + w.name : "Deduction for " + w.name} onClose={() => setSub(null)}>
          <div className="lsub center" style={{ marginBottom: 16 }}>
            {adjKind === "bonus" ? "Why the bonus?" : "Why the deduction?"}
          </div>
          <div className="catgrid" style={{ marginBottom: 18 }}>
            {(adjKind === "bonus" ? BONUS_REASONS : DEDUCT_REASONS).map((r) => (
              <button
                key={r}
                className="cat vs-press"
                style={{ justifyContent: "center" }}
                onClick={() => {
                  setAdjReason(r);
                  setSub("adj-amt");
                }}
              >
                <span style={{ fontSize: 16 }}>{r}</span>
              </button>
            ))}
          </div>
          <div className="group g2">
            <FormRow label="Another reason" value={adjOther} onChange={setAdjOther} placeholder="Helped repair engine" />
          </div>
          <div style={{ height: 16 }} />
          <Btn
            label="Continue"
            disabled={!adjOther.trim()}
            onClick={() => {
              setAdjReason(adjOther.trim());
              setSub("adj-amt");
            }}
          />
        </Modal>
      )}

      {w && sub === "adj-amt" && (
        <KeypadSheet
          title={(adjKind === "bonus" ? "Bonus: " : "Deduction: ") + adjReason}
          HeaderIcon={adjKind === "bonus" ? Plus : Minus}
          subtitle={adjKind === "bonus" ? "Extra money for " + w.name : "Money removed from " + w.name + "'s payout"}
          quick={[20, 50, 100]}
          confirmLabel={adjKind === "bonus" ? "Save bonus" : "Save deduction"}
          onClose={() => setSub("adj-reason")}
          onSave={({ amount, date }) => {
            addAdjustment(w.id, { id: uid(), date, kind: adjKind, amount, reason: adjReason });
            setSub(null);
            toast((adjKind === "bonus" ? "Bonus saved · " : "Deduction saved · ") + fmt(amount));
          }}
        />
      )}
      {w && sub === "statement" && (
        <Modal title={"Statement for " + w.name} onClose={() => setSub(null)}>
          <pre className="stmt">{buildStatement(state, fin, w)}</pre>
          <a
            href={waLink(w.phone, buildStatement(state, fin, w))}
            target="_blank"
            rel="noreferrer"
            style={{ textDecoration: "none", display: "block", marginBottom: 8 }}
          >
            <Btn label={<><MessageCircle size={19} strokeWidth={2} /> Share on WhatsApp</>} onClick={() => {}} />
          </a>
          <Btn
            label={copied ? <><Check size={19} strokeWidth={2.4} /> Copied</> : <><Copy size={19} strokeWidth={2} /> Copy Text</>}
            kind="ghost"
            onClick={() => copyText(buildStatement(state, fin, w)).then(() => setCopied(true))}
          />
        </Modal>
      )}

      {w && del && (
        <ConfirmRemove
          title={histLabel(del) + " · " + fmt(del.amount)}
          lines={[fmtDate(del.date)]}
          onClose={() => setDel(null)}
          onConfirm={() => {
            if (del.k === "loan") removeLoan(w.id, del.id);
            else if (del.k === "pay") removePayment(w.id, del.id);
            else removeAdjustment(w.id, del.id);
            setDel(null);
            toast("Entry removed");
          }}
        />
      )}
    </div>
  );
}

/* ---------------- KeypadSheet: Apple Cash-style amount entry ---------------- */
function KeypadSheet({
  title,
  HeaderIcon,
  subtitle,
  quick = [],
  maxAmount = null,
  maxMsg = "More than the limit.",
  confirmLabel = "Save",
  onSave,
  onClose,
}) {
  const [val, setVal] = useState("");
  const [date, setDate] = useState(todayISO());
  const [editDate, setEditDate] = useState(false);
  const amount = Number(val) || 0;
  const over = maxAmount != null && amount > maxAmount;

  const press = (k) => {
    if (k === "del") return setVal((v) => v.slice(0, -1));
    setVal((v) => {
      if (k === "." && v.includes(".")) return v;
      if (v.includes(".") && v.split(".")[1].length >= 2) return v;
      if (v.replace(".", "").length >= 8) return v;
      if (v === "" && k === ".") return "0.";
      if (v === "0" && k !== ".") return k;
      return v + k;
    });
  };

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "del"];
  return (
    <Modal title={title} onClose={onClose}>
      {subtitle ? (
        <div className="ksub">
          {HeaderIcon ? <HeaderIcon size={17} color={C.tint} strokeWidth={2.2} /> : null}
          <span className="truncate">{subtitle}</span>
        </div>
      ) : null}
      <AmountBig value={val} color={over ? C.red : undefined} />
      <div className="chips">
        <DateChip date={date} setDate={setDate} />
        {quick.map((q) => (
          <button key={q} className={"chip" + (val === String(q) ? " on" : "")} onClick={() => setVal(String(q))}>
            {q}
          </button>
        ))}
      </div>
      <div className="kmsg" style={{ color: over ? C.red : C.sec }}>
        {maxAmount != null ? (over ? maxMsg : "Limit: " + fmt(maxAmount)) : " "}
      </div>
      <Keypad onKey={press} />
      <div style={{ height: 10 }} />
      <Btn
        label={confirmLabel + (amount > 0 ? " · " + fmt(amount) : "")}
        disabled={!amount || over}
        onClick={() => onSave({ amount, date })}
      />
    </Modal>
  );
}


/* -------- credit sales: what customers still owe --------
   A sale records the total and the cash taken at the time.
   Anything not paid sits in Credit until the customer settles. */
function salePaid(sale) {
  const atSale = Number(sale.paid) || 0;
  const after = (sale.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return atSale + after;
}
function saleOutstanding(sale) {
  return Math.max(0, (Number(sale.amount) || 0) - salePaid(sale));
}
function saleStatusLabel(sale) {
  const due = saleOutstanding(sale);
  if (due <= 0.004) return "Paid";
  if (salePaid(sale) > 0) return "Partly paid";
  return "Credit";
}
function creditCustomers(sales) {
  const map = {};
  (sales || []).forEach((s) => {
    const due = saleOutstanding(s);
    if (due <= 0.004) return;
    const name = (s.customer || "").trim() || "Unknown customer";
    const row = map[name] || (map[name] = { name, owed: 0, orig: 0, paid: 0, sales: [] });
    row.owed += due;
    row.orig += Number(s.amount) || 0;
    row.paid += salePaid(s);
    row.sales.push(s);
  });
  return Object.values(map).sort((a, b) => b.owed - a.owed);
}

/* ---------------- statement helpers ---------------- */
function buildStatement(state, fin, w) {
  const n = workerNumbers(state, w, fin);
  const posName = w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;
  const lines = [
    "VAULTSTACK STATEMENT",
    state.company.name,
    "Season: " + state.season.name,
    "For: " + w.name + (posName ? " (" + posName + ")" : ""),
    "------------------------------",
    `Share units: ${w.units} of ${fin.totalUnits}`,
    "Value per unit: " + fmt(fin.vpu),
    "Share from units: " + fmt(n.unitShare),
  ];
  if (n.posPay > 0) lines.push("Position pay (" + posName + "): + " + fmt(n.posPay));
  lines.push(
    "Bonuses: + " + fmt(n.bonusTotal),
    "Deductions: − " + fmt(n.dedTotal),
    "Loans taken: − " + fmt(n.loansTotal),
    "Payments received: − " + fmt(n.paymentsTotal),
    "Debt from last season: − " + fmt(n.carried),
    "------------------------------",
    "PAYOUT SO FAR: " + fmt(n.payout),
    n.payout < 0
      ? "Note: this debt will carry to next season."
      : "Estimate only — final amount at season close."
  );
  return lines.join("\n");
}
function waLink(phone, text) {
  let p = (phone || "").replace(/\D/g, "");
  if (p.startsWith("0")) p = "233" + p.slice(1);
  const base = p ? "https://wa.me/" + p : "https://wa.me/";
  return base + "?text=" + encodeURIComponent(text);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(
      () => true,
      () => fallbackCopy(text)
    );
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch {
    return false;
  }
}
