/* ============================================================
   VaultStack — Tier 1 Demo (v6)
   New payout engine (from real owner research):
     Net pot
     − Position pay (off the top, BEFORE split)   [confirm w/ owner]
     = Splittable pot
     × ownerSplit%  → Owner's maintenance half (default 50)
     × (100−ownerSplit)% → Workers' half, divided by share units
   Per worker: share of workers' half + own position pay
               − loans − payments − deductions + bonuses − carried debt
   One company only (multi-company deferred by decision).
   ============================================================ */

/* ---------------- storage (offline-first, localStorage-backed) ---------------- */
async function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
async function persist(state) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch {
    return false;
  }
}
async function wipeSaved() {
  try {
    localStorage.removeItem(STORE_KEY);
  } catch {}
}

function normalizeState(s) {
  if (!s) return s;
  return {
    ...s,
    sales: s.sales || [],
    expenses: s.expenses || [],
    pastSeasons: s.pastSeasons || [],
    positions: s.positions || [],
    expenseCats:
      s.expenseCats && s.expenseCats.length ? s.expenseCats : [...DEFAULT_EXPENSE_CATS],
    company: {
      ...(s.company || {}),
      ownerSplit: s.company && s.company.ownerSplit != null ? s.company.ownerSplit : 50,
      positionsBeforeSplit:
        s.company && s.company.positionsBeforeSplit != null
          ? s.company.positionsBeforeSplit
          : true,
    },
    season: { ...(s.season || {}), fixed: (s.season && s.season.fixed) || [] },
    workers: (s.workers || []).map((w) => ({
      ...w,
      positionId: w.positionId || null,
      loans: w.loans || [],
      payments: w.payments || [],
      adjustments: w.adjustments || [],
    })),
  };
}

/* ---------------- payout engine (positions + configurable split) ---------------- */
function positionPayFor(state, w) {
  if (!w.positionId) return 0;
  const p = state.positions.find((x) => x.id === w.positionId);
  return p ? Number(p.pay) || 0 : 0;
}
function computeFinancials(state) {
  const grossSales = state.sales.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const fixedTotal = state.season.fixed.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const varTotal = state.expenses.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const netPot = grossSales - fixedTotal - varTotal;

  const positionsTotal = state.workers.reduce((s, w) => s + positionPayFor(state, w), 0);
  const beforeSplit = state.company.positionsBeforeSplit !== false;

  const potForSplit = beforeSplit ? Math.max(0, netPot - positionsTotal) : Math.max(0, netPot);

  const ownerPct = Number(state.company.ownerSplit) || 0;
  const ownerHalf = (potForSplit * ownerPct) / 100;
  const workersHalf = potForSplit - ownerHalf;

  const totalUnits = state.workers.reduce((s, w) => s + (Number(w.units) || 0), 0);
  const vpu = totalUnits > 0 ? workersHalf / totalUnits : 0;

  return {
    grossSales,
    fixedTotal,
    varTotal,
    netPot,
    positionsTotal,
    beforeSplit,
    potForSplit,
    ownerPct,
    ownerHalf,
    workersHalf,
    totalUnits,
    vpu,
  };
}
function workerNumbers(state, w, fin) {
  const unitShare = (Number(w.units) || 0) * fin.vpu;
  const posPay = positionPayFor(state, w);
  const grossShare = unitShare + posPay;
  const loansTotal = (w.loans || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const paymentsTotal = (w.payments || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const adj = w.adjustments || [];
  const bonusTotal = adj
    .filter((a) => a.kind === "bonus")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const dedTotal = adj
    .filter((a) => a.kind === "deduction")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const carried = Number(w.carriedDebt) || 0;
  const payout = grossShare + bonusTotal - dedTotal - loansTotal - paymentsTotal - carried;
  const borrowLimit = Math.max(0, grossShare + bonusTotal - dedTotal - loansTotal - carried);
  return {
    unitShare,
    posPay,
    grossShare,
    loansTotal,
    paymentsTotal,
    bonusTotal,
    dedTotal,
    carried,
    payout,
    borrowLimit,
  };
}

/* ---------------- presets ---------------- */
function catIcon(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("premix") || n.includes("fuel") || n.includes("petrol")) return Fuel;
  if (n.includes("ice")) return Snowflake;
  if (n.includes("food") || n.includes("chop")) return UtensilsCrossed;
  if (n.includes("repair") || n.includes("net") || n.includes("mend")) return Wrench;
  if (n.includes("transport") || n.includes("car") || n.includes("lorry")) return Car;
  return Package;
}

const baseFont =

function Btn({ label, onClick, kind = "primary", full = true, small = false, disabled = false }) {
  const styles = {
    primary: { background: NAVY, color: "#fff", border: "2px solid " + NAVY },
    ghost: { background: "#fff", color: NAVY, border: "2px solid " + NAVY },
    quiet: { background: MIST, color: INK, border: "2px solid " + MIST },
    danger: { background: "#fff", color: BAD, border: "2px solid " + BAD },
    dangerSolid: { background: BAD, color: "#fff", border: "2px solid " + BAD },
  }[kind];
  return (
    <button
      onClick={disabled ? undefined : onClick}
      style={{
        ...styles,
        opacity: disabled ? 0.45 : 1,
        width: full ? "100%" : "auto",
        padding: small ? "10px 14px" : "16px 18px",
        borderRadius: 14,
        fontSize: small ? 15 : 18,
        fontWeight: 700,
        fontFamily: baseFont,
        cursor: disabled ? "default" : "pointer",
        touchAction: "manipulation",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 8,
      }}
    >
      {label}
    </button>
  );
}

/* ---------------- PIN pad ---------------- */
function PinPad({ title, subtitle, onComplete, errorMsg }) {
  const [digits, setDigits] = useState("");
  useEffect(() => {
    if (digits.length === 4) {
      const d = digits;
      setDigits("");
      onComplete(d);
    }
  }, [digits, onComplete]);
  const press = (k) => {
    if (k === "del") setDigits((d) => d.slice(0, -1));
    else if (digits.length < 4) setDigits((d) => d + k);
  };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
  return (
    <div style={{ textAlign: "center", padding: "30px 22px" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>
        <div
          style={{
            width: 64,
            height: 64,
            borderRadius: 18,
            background: MIST,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
          }}
        >
          <Lock size={30} color={NAVY} strokeWidth={2.4} />
        </div>
      </div>
      <div style={{ fontSize: 22, fontWeight: 800, color: INK }}>{title}</div>
      <div style={{ fontSize: 15, color: "#5A6675", margin: "6px 0 18px" }}>{subtitle}</div>
      <div style={{ display: "flex", justifyContent: "center", gap: 14, marginBottom: 8 }}>
        {[0, 1, 2, 3].map((i) => (
          <div
            key={i}
            style={{
              width: 18,
              height: 18,
              borderRadius: 999,
              border: "2.5px solid " + NAVY,
              background: i < digits.length ? NAVY : "transparent",
            }}
          />
        ))}
      </div>
      <div style={{ height: 22, color: BAD, fontSize: 14, fontWeight: 700 }}>{errorMsg || ""}</div>
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(3, 1fr)",
          gap: 12,
          maxWidth: 300,
          margin: "0 auto",
        }}
      >
        {keys.map((k, i) =>
          k === "" ? (
            <div key={i} />
          ) : (
            <Key key={i} onClick={() => press(k)}>
              {k === "del" ? <Delete size={22} /> : k}
            </Key>
          )
        )}
      </div>
    </div>
  );
}

/* ---------------- KeypadSheet: MoMo-style amount entry ---------------- */
function KeypadSheet({
  title,
  HeaderIcon,
  subtitle,
  quick = [],
  maxAmount = null,
  maxMsg = "More than the limit.",
  confirmLabel = "Save",
  onSave,
  onClose,
}) {
  const [val, setVal] = useState("");
  const [date, setDate] = useState(todayISO());
  const [editDate, setEditDate] = useState(false);
  const amount = Number(val) || 0;
  const over = maxAmount != null && amount > maxAmount;

  const press = (k) => {
    if (k === "del") return setVal((v) => v.slice(0, -1));
    setVal((v) => {
      if (k === "." && v.includes(".")) return v;
      if (v.includes(".") && v.split(".")[1].length >= 2) return v;
      if (v.replace(".", "").length >= 8) return v;
      if (v === "" && k === ".") return "0.";
      if (v === "0" && k !== ".") return k;
      return v + k;
    });
  };

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "del"];

  return (
    <Modal title={title} onClose={onClose}>
      {subtitle && (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 8,
            fontSize: 14.5,
            color: "#5A6675",
            marginBottom: 10,
          }}
        >
          {HeaderIcon && <HeaderIcon size={18} color={NAVY} />}
          <span>{subtitle}</span>
        </div>
      )}

      <div
        style={{
          background: MIST,
          borderRadius: 16,
          padding: "18px 16px",
          textAlign: "center",
          marginBottom: 12,
        }}
      >
        <div
          style={{
            fontSize: 38,
            fontWeight: 900,
            color: over ? BAD : NAVY,
            fontVariantNumeric: "tabular-nums",
            letterSpacing: 0.5,
          }}
        >
          GH₵ {val === "" ? "0" : val}
        </div>
        <button
          onClick={() => setEditDate((e) => !e)}
          style={{
            border: "none",
            background: "none",
            color: "#5A6675",
            fontSize: 13.5,
            fontWeight: 700,
            textDecoration: "underline",
            cursor: "pointer",
            marginTop: 4,
          }}
        >
          {date === todayISO() ? "Today" : fmtDate(date)} · change
        </button>
        {editDate && (
          <div style={{ marginTop: 8 }}>
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              style={{
                padding: "10px 12px",
                fontSize: 16,
                border: "2px solid " + LINE,
                borderRadius: 10,
                fontFamily: baseFont,
              }}
            />
          </div>
        )}
      </div>

      {quick.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {quick.map((q) => (
            <button
              key={q}
              onClick={() => setVal(String(q))}
              style={{
                flex: 1,
                padding: "10px 0",
                borderRadius: 12,
                border: "2px solid " + (val === String(q) ? NAVY : LINE),
                background: val === String(q) ? "#E8EEF7" : "#fff",
                color: NAVY,
                fontWeight: 800,
                fontSize: 15,
                cursor: "pointer",
              }}
            >
              {q}
            </button>
          ))}
        </div>
      )}

      <div
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(3, 1fr)",
          gap: 10,
          marginBottom: 12,
        }}
      >
        {keys.map((k, i) => (
          <Key key={i} onClick={() => press(k)}>
            {k === "del" ? <Delete size={22} /> : k}
          </Key>
        ))}
      </div>

      {maxAmount != null && (
        <div
          style={{
            fontSize: 14,
            fontWeight: 700,
            color: over ? BAD : "#5A6675",
            marginBottom: 10,
            textAlign: "center",
          }}
        >
          {over ? maxMsg : "Limit: " + fmt(maxAmount)}
        </div>
      )}

      <Btn
        label={confirmLabel + (amount > 0 ? " · " + fmt(amount) : "")}
        disabled={!amount || over}

/* ---------------- statement helpers ---------------- */
function buildStatement(state, fin, w) {
  const n = workerNumbers(state, w, fin);
  const posName = w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;
  const lines = [
    "VAULTSTACK STATEMENT",
    state.company.name,
    "Season: " + state.season.name,
    "For: " + w.name + (posName ? " (" + posName + ")" : ""),
    "------------------------------",
    `Share units: ${w.units} of ${fin.totalUnits}`,
    "Value per unit: " + fmt(fin.vpu),
    "Share from units: " + fmt(n.unitShare),
  ];
  if (n.posPay > 0) lines.push("Position pay (" + posName + "): + " + fmt(n.posPay));
  lines.push(
    "Bonuses: + " + fmt(n.bonusTotal),
    "Deductions: − " + fmt(n.dedTotal),
    "Loans taken: − " + fmt(n.loansTotal),
    "Payments received: − " + fmt(n.paymentsTotal),
    "Debt from last season: − " + fmt(n.carried),
    "------------------------------",
    "PAYOUT SO FAR: " + fmt(n.payout),
    n.payout < 0
      ? "Note: this debt will carry to next season."
      : "Estimate only — final amount at season close."
  );
  return lines.join("\n");
}
function waLink(phone, text) {
  let p = (phone || "").replace(/\D/g, "");
  if (p.startsWith("0")) p = "233" + p.slice(1);
  const base = p ? "https://wa.me/" + p : "https://wa.me/";
  return base + "?text=" + encodeURIComponent(text);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(
      () => true,
      () => fallbackCopy(text)
    );
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch {
    return false;
  }
}

/* ---------------- History tab (totals + day-grouped log) ---------------- */
function HistoryTab({ state, fin, openSale, openExpense, removeSale, removeExpense, toast }) {
  const [del, setDel] = useState(null);

  const fmtTime = (iso) => {
    if (!iso) return "";
    return new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  };

  const grouped = useMemo(() => {
    const s = state.sales.map((x) => ({ ...x, kind: "sale" }));
    const e = state.expenses.map((x) => ({ ...x, kind: "expense" }));
    const byDate = {};
    [...s, ...e].forEach((item) => {
      (byDate[item.date] = byDate[item.date] || []).push(item);
    });
    const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));
    dates.forEach((d) => {
      byDate[d].sort((a, b) => {
        const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tb - ta;
      });
    });
    return { dates, byDate };
  }, [state.sales, state.expenses]);

  return (
    <div>

          </div>

      <div style={{ fontSize: 13, color: "#8A94A3", marginBottom: 8 }}>Tap an entry to remove it.</div>

          onConfirm={() => {
            if (del.kind === "sale") removeSale(del.id);
            else removeExpense(del.id);
            setDel(null);
            toast("Entry removed");
          }}
        />
      )}
    </div>
  );
}

/* ---------------- Workers tab ---------------- */
function WorkersTab({
  state,
  fin,
  addLoan,
  addPayment,
  addAdjustment,
  removeLoan,
  removePayment,
  removeAdjustment,
  toast,
}) {
  const [openId, setOpenId] = useState(null);
  const [sub, setSub] = useState(null);
  const [payDesc, setPayDesc] = useState("");
  const [goodsOther, setGoodsOther] = useState("");
  const [adjKind, setAdjKind] = useState("deduction");
  const [adjReason, setAdjReason] = useState("");
  const [adjOther, setAdjOther] = useState("");
  const [copied, setCopied] = useState(false);
  const [del, setDel] = useState(null);

  const w = state.workers.find((x) => x.id === openId) || null;
  const n = w ? workerNumbers(state, w, fin) : null;
  const posName = w && w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;

  const histRows = w
    ? [
        ...w.loans.map((l) => ({ ...l, k: "loan" })),
        ...w.payments.map((p) => ({ ...p, k: "pay" })),
        ...w.adjustments.map((a) => ({ ...a, k: "adj" })),
      ].sort((a, b) => (a.date < b.date ? 1 : -1))
    : [];

  const histLabel = (h) => {
    if (h.k === "loan") return "Loan";
    if (h.k === "pay") return h.desc || "Payment";
    return (h.kind === "bonus" ? "Bonus" : "Deduction") + (h.reason ? " · " + h.reason : "");
  };
  const histAmount = (h) =>
    h.k === "adj" && h.kind === "bonus" ? "+ " + fmt(h.amount) : "− " + fmt(h.amount);

  return (
    <div>
      {state.workers.map((wk) => {
        const k = workerNumbers(state, wk, fin);
        const pn = wk.positionId
          ? (state.positions.find((p) => p.id === wk.positionId) || {}).name
          : null;
        const tone = k.payout < 0 ? "bad" : k.loansTotal + k.carried > k.grossShare * 0.7 ? "warn" : "good";
        return (
          <Card key={wk.id} pad={14} style={{ cursor: "pointer" }}>
            <div onClick={() => { setOpenId(wk.id); setSub(null); setCopied(false); }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <div style={{ fontWeight: 900, fontSize: 17, display: "flex", alignItems: "center", gap: 7 }}>
                  {wk.name}
                  {pn && <Star size={15} color={WARN} fill={WARN} />}
                </div>
                <Pill text={pn ? pn : wk.units + " units"} tone={pn ? "warn" : "navy"} />
              </div>
              <Row left="Share so far" right={fmt(k.grossShare)} />
              <Row left="Will take home" right={fmt(k.payout)} strong color={k.payout < 0 ? BAD : GOOD} />
              <Row left="Can still borrow" right={fmt(k.borrowLimit)} />
              <div style={{ marginTop: 6 }}>
                <Pill
                  text={k.payout < 0 ? "In debt — carries over" : tone === "warn" ? "Borrowing high" : "Healthy"}
                  tone={tone}
                />
              </div>
            </div>
          </Card>
        );
      })}

      {w && sub === null && (
        <Modal title={w.name + (posName ? " · " + posName : "")} onClose={() => setOpenId(null)}>
          <Card pad={14} style={{ background: MIST, border: "none" }}>
            <Row left={"Share from units (" + w.units + " × " + fmt(fin.vpu) + ")"} right={fmt(n.unitShare)} />
            {n.posPay > 0 && <Row left={"Position pay (" + posName + ")"} right={"+ " + fmt(n.posPay)} />}
            <Row left="Bonuses" right={"+ " + fmt(n.bonusTotal)} />
            <Row left="Deductions" right={"− " + fmt(n.dedTotal)} />
            <Row left="Loans this season" right={"− " + fmt(n.loansTotal)} />
            <Row left="Payments received" right={"− " + fmt(n.paymentsTotal)} />
            <Row left="Debt from last season" right={"− " + fmt(n.carried)} />
            <div style={{ borderTop: "1px solid " + LINE, margin: "4px 0" }} />
            <Row left="Payout so far" right={fmt(n.payout)} strong color={n.payout < 0 ? BAD : GOOD} />
            <Row left="Can still borrow" right={fmt(n.borrowLimit)} />
          </Card>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Btn label="Give loan" kind="ghost" onClick={() => setSub("loan")} />
            <Btn label="Record payment" kind="ghost" onClick={() => setSub("pay-type")} />
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Btn
              label={<><Plus size={18} /> Bonus</>}
              kind="ghost"
              onClick={() => { setAdjKind("bonus"); setAdjReason(""); setAdjOther(""); setSub("adj-reason"); }}
            />
            <Btn
              label={<><Minus size={18} /> Deduct</>}
              kind="ghost"
              onClick={() => { setAdjKind("deduction"); setAdjReason(""); setAdjOther(""); setSub("adj-reason"); }}
            />
          </div>
          <Btn label={<><MessageCircle size={20} /> Send statement</>} onClick={() => setSub("statement")} />
          {histRows.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontWeight: 800, fontSize: 15, color: NAVY }}>History</div>
              <div style={{ fontSize: 13, color: "#8A94A3", marginBottom: 4 }}>Tap an entry to remove it.</div>
              {histRows.map((h) => (
                <div
                  key={h.id}
                  onClick={() => setDel(h)}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "baseline",
                    padding: "8px 0",
                    cursor: "pointer",
                  }}
                >
                  <span style={{ fontSize: 15.5, color: "#4A5568" }}>
                    {histLabel(h)} · {fmtDate(h.date)}
                  </span>
                  <span
                    style={{
                      fontWeight: 700,
                      fontVariantNumeric: "tabular-nums",
                      color: h.k === "adj" && h.kind === "bonus" ? GOOD : INK,
                    }}
                  >
                    {histAmount(h)}
                  </span>
                </div>
              ))}
            </div>
          )}
        </Modal>
      )}

      {w && sub === "loan" && (
        <KeypadSheet
          title={"Loan for " + w.name}
          HeaderIcon={Banknote}
          subtitle={"Can borrow up to " + fmt(n.borrowLimit)}
          quick={[50, 100, 200]}
          maxAmount={n.borrowLimit}
          maxMsg="More than the borrowing limit."
          confirmLabel="Save loan"
          onClose={() => setSub(null)}
          onSave={({ amount, date }) => {
            addLoan(w.id, { id: uid(), date, amount, note: "" });
            setSub(null);
            toast("Loan saved · " + fmt(amount));
          }}
        />
      )}

      {w && sub === "pay-type" && (
        <Modal title={"Payment to " + w.name} onClose={() => setSub(null)}>
          <div style={{ fontSize: 15, color: "#5A6675", marginBottom: 14 }}>What did {w.name} receive?</div>
          <Btn label={<><Banknote size={20} /> Cash</>} onClick={() => { setPayDesc("Cash"); setSub("pay-amt"); }} />
          <div style={{ height: 10 }} />
          <Btn label={<><Package size={20} /> Goods</>} kind="ghost" onClick={() => { setGoodsOther(""); setSub("pay-goods"); }} />
        </Modal>
      )}

      {w && sub === "pay-goods" && (
        <Modal title="What goods?" onClose={() => setSub("pay-type")}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            {GOODS_PRESETS.map((g) => (
              <button
                key={g}
                onClick={() => { setPayDesc(g); setSub("pay-amt"); }}
                style={{
                  padding: "16px 8px",
                  borderRadius: 14,
                  border: "2px solid " + LINE,
                  background: "#fff",
                  fontWeight: 800,
                  fontSize: 15.5,
                  color: INK,
                  cursor: "pointer",
                }}
              >
                {g}
              </button>
            ))}
          </div>
          <Field label="Or type something else" value={goodsOther} onChange={setGoodsOther} placeholder="e.g. Outboard oil" />
          <Btn label="Next" disabled={!goodsOther.trim()} onClick={() => { setPayDesc(goodsOther.trim()); setSub("pay-amt"); }} />
        </Modal>
      )}

      {w && sub === "pay-amt" && (
        <KeypadSheet
          title={"Payment to " + w.name}
          HeaderIcon={payDesc === "Cash" ? Banknote : Package}
          subtitle={payDesc === "Cash" ? "Cash payment" : payDesc + " — agreed value"}
          quick={[20, 50, 100]}
          confirmLabel="Save payment"
          onClose={() => setSub("pay-type")}
          onSave={({ amount, date }) => {
            addPayment(w.id, {
              id: uid(),
              date,
              type: payDesc === "Cash" ? "cash" : "goods",
              amount,
              desc: payDesc,
            });
            setSub(null);
            toast("Payment saved · " + fmt(amount));
          }}
        />
      )}

      {w && sub === "adj-reason" && (
        <Modal title={adjKind === "bonus" ? "Bonus for " + w.name : "Deduction for " + w.name} onClose={() => setSub(null)}>
          <div style={{ fontSize: 15, color: "#5A6675", marginBottom: 14 }}>
            {adjKind === "bonus" ? "Why the bonus?" : "Why the deduction?"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            {(adjKind === "bonus" ? BONUS_REASONS : DEDUCT_REASONS).map((r) => (
              <button
                key={r}
                onClick={() => { setAdjReason(r); setSub("adj-amt"); }}
                style={{
                  padding: "16px 8px",
                  borderRadius: 14,
                  border: "2px solid " + LINE,
                  background: "#fff",
                  fontWeight: 800,
                  fontSize: 15.5,
                  color: INK,
                  cursor: "pointer",
                }}
              >
                {r}
              </button>
            ))}
          </div>
          <Field label="Or type another reason" value={adjOther} onChange={setAdjOther} placeholder="e.g. Helped repair engine" />
          <Btn label="Next" disabled={!adjOther.trim()} onClick={() => { setAdjReason(adjOther.trim()); setSub("adj-amt"); }} />
        </Modal>
      )}

      {w && sub === "adj-amt" && (
        <KeypadSheet
          title={(adjKind === "bonus" ? "Bonus: " : "Deduction: ") + adjReason}
          HeaderIcon={adjKind === "bonus" ? Plus : Minus}
          subtitle={adjKind === "bonus" ? "Extra money for " + w.name : "Money removed from " + w.name + "'s payout"}
          quick={[20, 50, 100]}
          confirmLabel={adjKind === "bonus" ? "Save bonus" : "Save deduction"}
          onClose={() => setSub("adj-reason")}
          onSave={({ amount, date }) => {
            addAdjustment(w.id, { id: uid(), date, kind: adjKind, amount, reason: adjReason });
            setSub(null);
            toast((adjKind === "bonus" ? "Bonus saved · " : "Deduction saved · ") + fmt(amount));
          }}
        />
      )}

      {w && sub === "statement" && (
        <Modal title={"Statement for " + w.name} onClose={() => setSub(null)}>
          <pre
            style={{
              background: MIST,
              borderRadius: 12,
              padding: 14,
              fontSize: 13.5,
              whiteSpace: "pre-wrap",
              fontFamily: "ui-monospace, Menlo, monospace",
              color: INK,
            }}
          >
            {buildStatement(state, fin, w)}
          </pre>
          <a
            href={waLink(w.phone, buildStatement(state, fin, w))}
            target="_blank"
            rel="noreferrer"
            style={{ textDecoration: "none", display: "block", marginBottom: 10 }}
          >
            <Btn label={<><MessageCircle size={20} /> Share on WhatsApp</>} onClick={() => {}} />
          </a>
          <Btn
            label={copied ? <><Check size={20} /> Copied</> : <><Copy size={20} /> Copy text</>}
            kind="ghost"
            onClick={() => copyText(buildStatement(state, fin, w)).then(() => setCopied(true))}
          />
        </Modal>
      )}

      {w && del && (
        <ConfirmRemove
          title={histLabel(del) + " · " + fmt(del.amount)}
          lines={[fmtDate(del.date)]}
          onClose={() => setDel(null)}
          onConfirm={() => {
            if (del.k === "loan") removeLoan(w.id, del.id);
            else if (del.k === "pay") removePayment(w.id, del.id);
            else removeAdjustment(w.id, del.id);
            setDel(null);
            toast("Entry removed");
          }}
        />
      )}
    </div>
  );
}

/* ---------------- Weather tab ---------------- */
function WeatherTab() {
  const [wx, setWx] = useState({ status: "loading" });
  useEffect(() => {
    let alive = true;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    (async () => {
      try {
        const [mr, fr] = await Promise.all([
          fetch(
            "https://marine-api.open-meteo.com/v1/marine?latitude=5.9042&longitude=0.5847&current=wave_height",
            { signal: ctrl.signal }
          ),
          fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=5.9042&longitude=0.5847&current=wind_speed_10m,precipitation&wind_speed_unit=kmh",
            { signal: ctrl.signal }
          ),
        ]);
        const mj = await mr.json();
        const fj = await fr.json();
        if (!alive) return;
        setWx({
          status: "live",
          wave: mj.current?.wave_height ?? 0,
          wind: fj.current?.wind_speed_10m ?? 0,
          rain: fj.current?.precipitation ?? 0,
        });
      } catch {
        if (!alive) return;
        setWx({ status: "demo", wave: 0.9, wind: 14, rain: 0 });
      } finally {
        clearTimeout(t);
      }
    })();
    return () => {
      alive = false;
      ctrl.abort();
      clearTimeout(t);
    };
  }, []);

  if (wx.status === "loading")
    return (
      <Card>
        <div style={{ color: "#5A6675", fontSize: 15 }}>Checking the sea at Adina…</div>
      </Card>
    );

  const verdict =
    wx.wave >= 2 || wx.wind >= 30
      ? { label: "STAY ASHORE", tone: "bad", msg: "The sea is dangerous today. Do not go out." }
      : wx.wave >= 1.2 || wx.wind >= 20 || wx.rain >= 2
      ? { label: "CAUTION", tone: "warn", msg: "Conditions are rough. Go carefully or wait." }
      : { label: "SAFE", tone: "good", msg: "Good conditions for fishing today." };
  const vcol = { good: GOOD, warn: WARN, bad: BAD }[verdict.tone];

  return (
    <div>
      <Card style={{ borderLeft: "6px solid " + vcol }}>
        <div style={{ fontSize: 13, fontWeight: 800, color: "#5A6675", letterSpacing: 1 }}>
          ADINA, VOLTA REGION — NOW
        </div>
        <div style={{ fontSize: 32, fontWeight: 900, color: vcol, margin: "6px 0" }}>{verdict.label}</div>
        <div style={{ fontSize: 16, color: INK }}>{verdict.msg}</div>
      </Card>
      <Card>
        <Row left={<span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><Wind size={18} color={NAVY} /> Wind</span>} right={wx.wind + " km/h"} />
        <Row left={<span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><Waves size={18} color={NAVY} /> Waves</span>} right={wx.wave + " m"} />
        <Row left={<span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><CloudRain size={18} color={NAVY} /> Rain</span>} right={wx.rain + " mm"} />
      </Card>
      {wx.status === "demo" && (
        <Card style={{ background: MIST, border: "none" }}>
          <div style={{ fontSize: 14, color: "#5A6675" }}>
            <b>Offline.</b> Showing saved demo conditions — the app keeps working without network. Live
            data returns when connection is back.
          </div>
        </Card>
      )}
    </div>
  );
}

            })}
            <div style={{ borderTop: "1px solid " + LINE, margin: "4px 0" }} />
            <Row left="Owner's half" right={fmt(fin.ownerHalf)} strong />
          </Card>
          <Btn
            label="Yes, close season"
            onClick={() => {
              setConfirm(false);
              onCloseSeason();
            }}
          />
        </Modal>
      )}
    </div>
  );
}

/* ---------------- App shell ---------------- */
function VaultStack() {
  const [state, setState] = useState(null);
  const [locked, setLocked] = useState(false);
  const [pinErr, setPinErr] = useState("");
  const [tab, setTab] = useState("home");
  const [flow, setFlow] = useState(null);
  const [expCat, setExpCat] = useState(null);
  const [expSession, setExpSession] = useState([]);
  const [newCatName, setNewCatName] = useState("");
  const [toastMsg, setToastMsg] = useState(null);
  const [saveStamp, setSaveStamp] = useState(null);
  const saveTimer = useRef(null);
  const toastTimer = useRef(null);
  const firstRender = useRef(true);

  useEffect(() => {
    (async () => {
      const saved = normalizeState(await loadSaved());
      if (saved && saved.setupDone) {
        setState(saved);
        setLocked(Boolean(saved.pin));
      } else {
        setState(saved || blankState());
      }
    })();
  }, []);

  useEffect(() => {
    if (state === null) return;
    if (firstRender.current) {
      firstRender.current = false;
      return;
    }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStamp("saving");
    saveTimer.current = setTimeout(async () => {
      const ok = await persist(state);
      setSaveStamp(ok ? new Date() : "error");
    }, 450);
    return () => saveTimer.current && clearTimeout(saveTimer.current);
  }, [state]);

  const toast = (msg) => {
    setToastMsg(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2000);
  };

  const fin = useMemo(() => (state ? computeFinancials(state) : null), [state]);

  if (state === null)
    return (
      <div style={{ fontFamily: baseFont, padding: 40, textAlign: "center", color: "#5A6675" }}>
        Opening VaultStack…
      </div>
    );

  const addSale = (s) => setState((st) => ({ ...st, sales: [...st.sales, s] }));
  const addExpense = (e) => setState((st) => ({ ...st, expenses: [...st.expenses, e] }));
  const removeSale = (id) => setState((st) => ({ ...st, sales: st.sales.filter((x) => x.id !== id) }));
  const removeExpense = (id) => setState((st) => ({ ...st, expenses: st.expenses.filter((x) => x.id !== id) }));
  const addLoan = (wid, loan) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: [...w.loans, loan] } : w)),
    }));
  const addPayment = (wid, pay) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: [...w.payments, pay] } : w)),
    }));
  const addAdjustment = (wid, adj) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: [...w.adjustments, adj] } : w)),
    }));
  const removeLoan = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: w.loans.filter((x) => x.id !== id) } : w)),
    }));
  const removePayment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: w.payments.filter((x) => x.id !== id) } : w)),
    }));
  const removeAdjustment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: w.adjustments.filter((x) => x.id !== id) } : w)),
    }));
  const resolveCategory = (raw) => {
    const name = raw.trim();
    const existing = state.expenseCats.find((c) => c.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    setState((st) => ({ ...st, expenseCats: [...st.expenseCats, name] }));
    return name;
  };
  const closeSeason = () =>
    setState((st) => {
      const f = computeFinancials(st);
      const settlements = st.workers.map((w) => {
        const k = workerNumbers(st, w, f);
        return { name: w.name, payout: k.payout };
      });
      const nextYear = new Date().getFullYear();
      return {
        ...st,
        pastSeasons: [
          ...st.pastSeasons,
          { name: st.season.name, netPot: f.netPot, ownerHalf: f.ownerHalf, settlements },
        ],
        season: { ...st.season, name: "New Season " + nextYear, start: todayISO() },
        sales: [],
        expenses: [],
        workers: st.workers.map((w) => {
          const k = workerNumbers(st, w, f);
          return { ...w, carriedDebt: k.payout < 0 ? -k.payout : 0, loans: [], payments: [], adjustments: [] };
        }),
      };
    });
  const resetAll = async () => {
    await wipeSaved();
    firstRender.current = true;
    setState(blankState());
    setLocked(false);
    setTab("home");
    setFlow(null);
  };

  const shell = (children) => (
    <div
      style={{
        fontFamily: baseFont,
        background: MIST,
        height: "100%",
        maxWidth: 430,
        margin: "0 auto",
        position: "relative",
        display: "flex",
        flexDirection: "column",
      }}
    >
      {children}
    </div>
  );

  if (!state.setupDone)
    return shell(
      <div style={{ background: "#fff", flex: 1, overflowY: "auto" }}>
        <Onboarding
          onFinish={(d) => { setState(d); setTab("home"); }}
          onDemo={() => { setState(demoState()); setLocked(true); }}
        />
      </div>
    );

  if (locked)
    return shell(
      <div style={{ background: "#fff", flex: 1, overflowY: "auto" }}>
        <PinPad
          title="Enter your PIN"
          subtitle={state.company.name}
          errorMsg={pinErr}
          onComplete={(d) => {
            if (d === state.pin) { setLocked(false); setPinErr(""); }
            else setPinErr("Wrong PIN. Try again.");
          }}
        />
      </div>
    );

  const tabs = [
    { id: "home", Icon: Home, label: "Home" },
    { id: "history", Icon: Banknote, label: "History" },
    { id: "workers", Icon: Users, label: "Workers" },
    { id: "weather", Icon: Waves, label: "Weather" },
    { id: "more", Icon: Settings, label: "More" },
  ];

  const openSale = () => setFlow("sale");
  const openExpense = () => { setExpSession([]); setFlow("expense-cat"); };

  const availableCats = state.expenseCats.filter(
    (c) => !expSession.some((s) => s.cat.toLowerCase() === c.toLowerCase())
  );
  const sessionTotal = expSession.reduce((s, x) => s + x.amount, 0);

  return shell(
    <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
      <div
        style={{
          background: NAVY,
          color: "#fff",
          padding: "14px 18px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          flexShrink: 0,
        }}
      >
        <div style={{ fontWeight: 900, fontSize: 18, display: "flex", alignItems: "center", gap: 8 }}>
          <Anchor size={20} strokeWidth={2.4} /> VaultStack
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 12, opacity: 0.9 }}>
            {saveStamp === "saving" ? "Saving…" : saveStamp === "error" ? "Not saved" : "Saved on this phone"}
          </span>
          <button
            onClick={() => setLocked(true)}
            title="Lock app"
            style={{
              background: "rgba(255,255,255,0.15)",
              border: "none",
              color: "#fff",
              borderRadius: 8,
              padding: "6px 10px",
              fontSize: 13,
              fontWeight: 700,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              gap: 6,
            }}
          >
            <Lock size={14} /> Lock
          </button>
        </div>
      </div>

      <div style={{ flex: 1, padding: 14, overflowY: "auto", minHeight: 0 }}>
        {tab === "home" && <HomeTab state={state} fin={fin} openSale={openSale} openExpense={openExpense} />}
        {tab === "history" && (
          <HistoryTab
            state={state}
            fin={fin}
            openSale={openSale}
            openExpense={openExpense}
            removeSale={removeSale}
            removeExpense={removeExpense}
            toast={toast}
          />
        )}
        {tab === "workers" && (
          <WorkersTab
            state={state}
            fin={fin}
            addLoan={addLoan}
            addPayment={addPayment}
            addAdjustment={addAdjustment}
            removeLoan={removeLoan}
            removePayment={removePayment}
            removeAdjustment={removeAdjustment}
            toast={toast}
          />
        )}
        {tab === "weather" && <WeatherTab />}
        {tab === "more" && <MoreTab state={state} fin={fin} onCloseSeason={closeSeason} onReset={resetAll} />}
      </div>

      {flow === "sale" && (
        <KeypadSheet
          title="Log a fish sale"
          HeaderIcon={Fish}
          subtitle="How much money did you receive?"
          confirmLabel="Save sale"
          onClose={() => setFlow(null)}
          onSave={({ amount, date }) => {
            addSale({ id: uid(), date, amount, note: "", createdAt: new Date().toISOString() });
            setFlow(null);
            toast("Sale saved · " + fmt(amount));
          }}
        />
      )}

      {flow === "expense-cat" && (
        <Modal title="What did you pay for?" onClose={() => setFlow(null)}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {availableCats.map((name) => {
              const Icon = catIcon(name);
              return (
                <button
                  key={name}
                  onClick={() => { setExpCat(name); setFlow("expense-amt"); }}
                  style={{
                    padding: "18px 8px",
                    borderRadius: 16,
                    border: "2px solid " + LINE,
                    background: "#fff",
                    cursor: "pointer",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <Icon size={28} color={NAVY} strokeWidth={2.2} />
                  <span style={{ fontWeight: 800, fontSize: 15, color: INK }}>{name}</span>
                </button>
              );
            })}
            <button
              onClick={() => { setNewCatName(""); setFlow("expense-name"); }}
              style={{
                padding: "18px 8px",
                borderRadius: 16,
                border: "2px dashed " + NAVY,
                background: "#fff",
                cursor: "pointer",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 8,
              }}
            >
              <Plus size={28} color={NAVY} strokeWidth={2.2} />
              <span style={{ fontWeight: 800, fontSize: 15, color: NAVY }}>Other</span>
            </button>
          </div>

          {expSession.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 15, color: NAVY, marginBottom: 4 }}>Logged just now</div>
              {expSession.map((s, i) => {
                const SIcon = catIcon(s.cat);
                return (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 15.5, color: "#4A5568" }}>
                      <Check size={17} color={GOOD} strokeWidth={3} /> <SIcon size={17} color={NAVY} /> {s.cat}
                    </span>
                    <span style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>− {fmt(s.amount)}</span>
                  </div>
                );
              })}
              <div style={{ borderTop: "1px solid " + LINE, margin: "4px 0" }} />
              <Row left="Total this sitting" right={"− " + fmt(sessionTotal)} strong />
              <div style={{ height: 10 }} />
              <Btn label={<><Check size={20} /> Done</>} onClick={() => setFlow(null)} />
            </div>
          )}
        </Modal>
      )}

      {flow === "expense-name" && (
        <Modal title="Name this expense" onClose={() => setFlow("expense-cat")}>
          <div style={{ fontSize: 15, color: "#5A6675", marginBottom: 14 }}>
            Give it a name once. It will be saved as a button for next time.
          </div>
          <Field label="What is it called?" value={newCatName} onChange={setNewCatName} placeholder="e.g. Net mending" />
          <Btn
            label="Next"
            disabled={!newCatName.trim()}
            onClick={() => {
              const finalName = resolveCategory(newCatName);
              setExpCat(finalName);
              setFlow("expense-amt");
            }}
          />
        </Modal>
      )}

      {flow === "expense-amt" && (
        <KeypadSheet
          title={"Expense: " + expCat}
          HeaderIcon={catIcon(expCat)}
          subtitle="How much did you pay?"
          confirmLabel="Save expense"
          onClose={() => setFlow("expense-cat")}
          onSave={({ amount, date }) => {
            addExpense({ id: uid(), date, amount, category: expCat, createdAt: new Date().toISOString() });
            setExpSession((prev) => [...prev, { cat: expCat, amount }]);
            toast(expCat + " saved · " + fmt(amount));
            setFlow("expense-cat");
          }}
        />
      )}

      {toastMsg && (
        <div
          style={{
            position: "absolute",
            bottom: 84,
            left: "50%",
            transform: "translateX(-50%)",
            background: INK,
            color: "#fff",
            padding: "12px 18px",
            borderRadius: 999,
            fontSize: 14.5,
            fontWeight: 800,
            display: "flex",
            alignItems: "center",
            gap: 8,
            zIndex: 60,
            whiteSpace: "nowrap",
          }}
        >
          <Check size={18} color="#7BE495" /> {toastMsg}
        </div>
      )}

      <div style={{ display: "flex", borderTop: "1px solid " + LINE, background: "#fff", flexShrink: 0, paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        {tabs.map(({ id, Icon, label }) => (
          <button
            key={id}
            onClick={() => { setTab(id); setFlow(null); }}
            style={{
              flex: 1,
              padding: "10px 0 12px",
              border: "none",
              background: "none",
              cursor: "pointer",
              color: tab === id ? NAVY : "#8A94A3",
              fontWeight: tab === id ? 900 : 600,
              fontSize: 12.5,
              fontFamily: baseFont,
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              gap: 3,
            }}
          >
            <Icon size={22} strokeWidth={tab === id ? 2.6 : 2} />
            {label}
            <div style={{ width: 22, height: 3, background: tab === id ? NAVY : "transparent", borderRadius: 99 }} />
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VaultStack />);
</script>
</body>
</html>
