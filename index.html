<style>
*{box-sizing:border-box}
:root{
  color-scheme: light;
  /* VaultStack palette — deep marine green, one lime accent, warm neutrals */
  --green:#0B3B2E;
  --green-deep:#08281F;
  --green-soft:#E7EFEA;
  --lime:#C6F04E;
  --ink:#0E1B15;
  --muted:#5D6B65;
  --mist:#F2F5F3;
  --line:#DEE5E0;
  --good:#177A4B;
  --warn:#8F5B00;
  --bad:#B3382A;
  --sea:#0F7A5E;
  --gold:#A9791D;
}
html,body{height:100%;margin:0}
body{
  background:#E6EBE8;
  color:var(--ink);
  font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
#root{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
/* the app frame: a phone-width column at every screen size */
.vs-shell{
  width:100%;
  max-width:430px;
  height:100%;
  margin:0 auto;
  background:var(--mist);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
.vs-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
/* desktop: keep the phone proportions instead of stretching the UI */
@media (min-width:560px){
  .vs-shell{
    height:calc(100% - 48px);
    max-height:880px;
    margin:auto;
    border:1px solid #D4DDD7;
    border-radius:22px;
    box-shadow:0 22px 60px rgba(8,40,30,0.16);
  }
  .vs-scroll{padding-bottom:16px}
}
input,button,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0}
::selection{background:#D9E9CE}
/* tabular money columns and safe truncation */
.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vs-press:active{opacity:.72}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

/* ---------------- storage (offline-first, localStorage-backed) ---------------- */
async function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
async function persist(state) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch {
    return false;
  }
}
async function wipeSaved() {
  try {
    localStorage.removeItem(STORE_KEY);
  } catch {}
}

  if (!s) return s;
  return {
    ...s,
    sales: s.sales || [],
    expenses: s.expenses || [],
    pastSeasons: s.pastSeasons || [],
    positions: s.positions || [],
    expenseCats:
      s.expenseCats && s.expenseCats.length ? s.expenseCats : [...DEFAULT_EXPENSE_CATS],
    company: {
      ...(s.company || {}),
      ownerSplit: s.company && s.company.ownerSplit != null ? s.company.ownerSplit : 50,
      positionsBeforeSplit:
        s.company && s.company.positionsBeforeSplit != null
          ? s.company.positionsBeforeSplit
          : true,
    },
    season: { ...(s.season || {}), fixed: (s.season && s.season.fixed) || [] },
    workers: (s.workers || []).map((w) => ({
      ...w,
      positionId: w.positionId || null,
      loans: w.loans || [],
      payments: w.payments || [],
      adjustments: w.adjustments || [],
    })),
  };
}

/* ---------------- payout engine (positions; whole pot shared by units) ---------------- */
function positionPayFor(state, w) {
  if (!w.positionId) return 0;
  const p = state.positions.find((x) => x.id === w.positionId);
  return p ? Number(p.pay) || 0 : 0;
}
function workerNumbers(state, w, fin) {
  const unitShare = (Number(w.units) || 0) * fin.vpu;
  const posPay = positionPayFor(state, w);
  const grossShare = unitShare + posPay;
  const loansTotal = (w.loans || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const paymentsTotal = (w.payments || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const adj = w.adjustments || [];
  const bonusTotal = adj
    .filter((a) => a.kind === "bonus")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const dedTotal = adj
    .filter((a) => a.kind === "deduction")
    .reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const carried = Number(w.carriedDebt) || 0;
  const payout = grossShare + bonusTotal - dedTotal - loansTotal - paymentsTotal - carried;
  const borrowLimit = Math.max(0, grossShare + bonusTotal - dedTotal - loansTotal - carried);
  return {
    unitShare,
    posPay,
    grossShare,
    loansTotal,
    paymentsTotal,
    bonusTotal,
    dedTotal,
    carried,
    payout,
    borrowLimit,
  };
}

/* ============================================================
   v8 — practical restyle + WebAuthn biometric unlock + engine
   simplification (owner's maintenance split removed; the whole
   net pot is shared by units after fixed costs, trip expenses
   and position pay). Legacy originals below are bound over and
   never executed.

const MONO2 = '"JetBrains Mono", ui-monospace, Menlo, monospace';

/* -------- password (PIN) storage: salted SHA-256, never plaintext -------- */
async function vsHashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ":" + pin + ":" + salt);
  const buf = await crypto.subtle.digest("SHA-256", data);
  const hex = Array.from(new Uint8Array(buf))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
  return salt + hex; /* salt travels with the record so vsVerifyPin can rebuild it */
}
async function vsVerifyPin(pin, record) {
  if (!record || typeof record !== "string") return false;
  if (record.startsWith("plain:")) return pin === record.slice(6);
  /* records written by older builds: the PIN was stored as plain digits */
  if (/^\d{4,8}$/.test(record)) return pin === record;
  /* current format: 16-char salt followed by the salted SHA-256 hash */
  if (/^[0-9a-f]{80}$/.test(record)) {
    const salt = record.slice(0, 16);
    return (await vsHashPin(pin, salt)) === record;
  }
  return false;
}
/* is this record already stored in the salted format? */
function vsPinIsSalted(record) {
  return typeof record === "string" && /^[0-9a-f]{80}$/.test(record);
}

/* -------- WebAuthn biometric unlock (real platform authenticator) --------
   The device's Face ID / Touch ID / Android biometric prompt is the
   authority. No biometric data ever reaches this app — only a key pair
   whose private key never leaves the device's secure hardware. The app
   stores only the credential id and marks the unlock method, never the
   PIN itself.
   ------------------------------------------------------------------------ */
const VS_BIO_KEY = "vaultstack:biometric:v1";
async function vsBioSupported() {
  try {
    if (!window.PublicKeyCredential || !navigator.credentials) return false;
    if (window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      return Boolean(
        await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
      );
    }
    return true;
  } catch {
    return false;
  }
}
async function vsBioEnroll() {
  if (!(await vsBioSupported())) throw new Error("Biometric unlock is not available on this device or browser.");
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = crypto.getRandomValues(new Uint8Array(16));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: "VaultStack" },
      user: {
        id: userId,
        name: "vaultstack-owner",
        displayName: "VaultStack owner",
      },
      pubKeyCredParams: [
        { type: "public-key", alg: -7 },
        { type: "public-key", alg: -257 },
      ],
      authenticatorSelection: {
        residentKey: "required",
        requireResidentKey: true,
        userVerification: "required",
      },
      timeout: 60000,
      attestation: "none",
    },
  });
  if (!cred) throw new Error("No credential was created.");
  localStorage.setItem(
    VS_BIO_KEY,
    JSON.stringify({
      credId: cred.id,
      enrolledAt: new Date().toISOString(),
    })
  );
  return true;
}
async function vsBioUnlock() {
  const raw = localStorage.getItem(VS_BIO_KEY);
  if (!raw) throw new Error("Biometric unlock is not set up on this device.");
  const rec = JSON.parse(raw);
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      rpId: location.hostname,
      allowCredentials: [{ id: base64urlToBuffer(rec.credId), type: "public-key" }],
      userVerification: "required",
      timeout: 60000,
    },
  });
  if (!assertion) throw new Error("Unlock was cancelled.");
  return true;
}
function base64urlToBuffer(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out.buffer;
}

/* -------- v8 payout engine: no owner's maintenance split -------- */
function computeFinancials2(state) {
  const grossSales = state.sales.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const fixedTotal = state.season.fixed.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const varTotal = state.expenses.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const netPot = grossSales - fixedTotal - varTotal;
  const positionsTotal = state.workers.reduce((s, w) => s + positionPayFor(state, w), 0);
  const beforeSplit = state.company.positionsBeforeSplit !== false;
  const potForSplit = beforeSplit ? Math.max(0, netPot - positionsTotal) : Math.max(0, netPot);
  const totalUnits = state.workers.reduce((s, w) => s + (Number(w.units) || 0), 0);
  const vpu = totalUnits > 0 ? potForSplit / totalUnits : 0;
  return {
    grossSales,
    fixedTotal,
    varTotal,
    netPot,
    positionsTotal,
    beforeSplit,
    potForSplit,
    totalUnits,
    vpu,
  };
}

        title={pinFirst ? "Enter PIN again" : "Set a 4-number PIN"}
        subtitle={
          pinFirst
            ? "Type the same PIN one more time."
            : "Only you will open this app. Worker debts stay private."
        }
        errorMsg={pinErr}
        onComplete={async (d) => {
          if (!pinFirst) {
            setPinFirst(d);
            setPinErr("");
          } else if (d === pinFirst) {
            const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)))
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
            const record = await vsHashPin(d, salt);
            const finalDraft = { ...draft, pin: record, setupDone: true };
            setDraft(finalDraft);
            if (bio && bio.supported) setBioStep(true);
            else onFinish(finalDraft);
          } else {
            setPinFirst(null);
            setPinErr("PINs did not match. Start again.");
          }
        }}
      />
    );

  return (
    <div style={{ padding: 20 }}>
      {step === 1 && (
        <div>
          {header("Your company", "Tell us about your business.", "STEP 1 OF 5")}
          <Field label="Company name" value={draft.company.name} onChange={(v) => setCo("name", v)} placeholder="e.g. Selasi Fishing Co." />
          <Field label="Owner name" value={draft.company.owner} onChange={(v) => setCo("owner", v)} placeholder="Your name" />
          <Field label="Phone number" value={draft.company.phone} onChange={(v) => setCo("phone", v)} inputMode="tel" placeholder="024 000 0000" />
          <Btn label="Next" onClick={() => setStep(2)} disabled={!draft.company.name.trim()} />
        </div>
      )}
      {step === 2 && (
        <div>
          {header("Positions", "Roles that earn standing pay each season (optional).", "STEP 2 OF 5")}
          {draft.positions.map((p) => (
            <Card key={p.id} pad={12}>
              <Row left={p.name} right={fmt(p.pay) + " / season"} />
            </Card>
          ))}
          <Field label="Position name" value={posName} onChange={setPosName} placeholder="e.g. Bosun" />
          <Field label="Pay per season (GH₵)" value={posPay} onChange={(v) => setPosPay(v.replace(/[^\d.]/g, ""))} inputMode="decimal" />
          <Btn label="+ Add position" kind="ghost" onClick={addPosition} />
          <div style={{ height: 12 }} />
          <div style={{ display: "flex", gap: 10 }}>
            <Btn label="Back" kind="quiet" onClick={() => setStep(1)} />
            <Btn label="Next" onClick={() => setStep(3)} />
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          {header("Fixed expenses", "Costs for the whole season, paid before sharing.", "STEP 3 OF 5")}
          {draft.season.fixed.map((f) => (
            <Card key={f.id} pad={12}>
              <Row left={f.name} right={fmt(f.amount)} />
            </Card>
          ))}
          <Field label="Expense name" value={fxName} onChange={setFxName} placeholder="e.g. Net repairs" />
          <Field label="Amount (GH₵)" value={fxAmt} onChange={(v) => setFxAmt(v.replace(/[^\d.]/g, ""))} inputMode="decimal" />
          <Btn label="+ Add expense" kind="ghost" onClick={addFixed} />
          <div style={{ height: 12 }} />
          <div style={{ display: "flex", gap: 10 }}>
            <Btn label="Back" kind="quiet" onClick={() => setStep(2)} />
            <Btn label="Next" onClick={() => setStep(4)} />
          </div>
        </div>
      )}
      {step === 4 && (
        <div>
          {header("Workers & shares", "Assign units and a position if they hold one.", "STEP 4 OF 5")}
          {draft.workers.map((w) => {
            const p = draft.positions.find((x) => x.id === w.positionId);
            return (
              <Card key={w.id} pad={12}>
                <Row
                  left={w.name + (p ? " · " + p.name : "")}
                  right={w.units + " units" + (w.carriedDebt ? " · owes " + fmt(w.carriedDebt) : "")}
                />
              </Card>
            );
          })}
          <Field label="Worker name" value={wkName} onChange={setWkName} placeholder="e.g. Kofi" />
          <Field label="Share units" value={wkUnits} onChange={(v) => setWkUnits(v.replace(/[^\d.]/g, ""))} inputMode="decimal" />
          <Field label="Phone (for WhatsApp statements)" value={wkPhone} onChange={setWkPhone} inputMode="tel" placeholder="Optional" />
          <Field label="Debt from last season (GH₵)" value={wkDebt} onChange={(v) => setWkDebt(v.replace(/[^\d.]/g, ""))} inputMode="decimal" placeholder="0" />
          {draft.positions.length > 0 && (
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13.5, fontWeight: 700, color: INK, marginBottom: 6 }}>Position (optional)</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                <button
                  onClick={() => setWkPos(null)}
                  style={{
                    padding: "10px 14px",
                    borderRadius: 8,
                    border: "1px solid " + (wkPos === null ? NAVY : LINE),
                    background: wkPos === null ? SOFT : "#fff",
                    fontWeight: 700,
                    fontSize: 14.5,
                    color: INK,
                    cursor: "pointer",
                  }}
                >
                  None
                </button>
                {draft.positions.map((p) => (
                  <button
                    key={p.id}
                    onClick={() => setWkPos(p.id)}
                    style={{
                      padding: "10px 14px",
                      borderRadius: 8,
                      border: "1px solid " + (wkPos === p.id ? NAVY : LINE),
                      background: wkPos === p.id ? SOFT : "#fff",
                      fontWeight: 700,
                      fontSize: 14.5,
                      color: INK,
                      cursor: "pointer",
                    }}
                  >
                    {p.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          <Btn label="+ Add worker" kind="ghost" onClick={addWorker} />
          <div style={{ height: 12 }} />
          <div style={{ display: "flex", gap: 10 }}>
            <Btn label="Back" kind="quiet" onClick={() => setStep(3)} />
            <Btn label="Next" onClick={() => setStep(5)} disabled={draft.workers.length === 0} />
          </div>
        </div>
      )}
      {step === 5 && (
        <div>
          {header("Season start", "When does this season begin?", "STEP 5 OF 5")}
          <Field label="Season name" value={draft.season.name} onChange={(v) => setSe("name", v)} placeholder="e.g. Major Season 2026" />
          <Field label="Start date" type="date" value={draft.season.start} onChange={(v) => setSe("start", v)} />
          <div style={{ display: "flex", gap: 10 }}>
            <Btn label="Back" kind="quiet" onClick={() => setStep(4)} />
            <Btn label="Next: set PIN" onClick={() => setStep(6)} disabled={!draft.season.name.trim()} />
          </div>
        </div>
      )}
    </div>
  );
}

function VaultStackV3() {
  const [state, setState] = useState(null);
  const [locked, setLocked] = useState(false);
  const [pinErr, setPinErr] = useState("");
  const [tab, setTab] = useState("home");
  const [flow, setFlow] = useState(null);
  const [expCat, setExpCat] = useState(null);
  const [expSession, setExpSession] = useState([]);
  const [newCatName, setNewCatName] = useState("");
  const [toastMsg, setToastMsg] = useState(null);
  const [saveStamp, setSaveStamp] = useState(null);
  const [bioSupported, setBioSupported] = useState(false);
  const [bioEnrolled, setBioEnrolled] = useState(false);
  const [bioUnlocking, setBioUnlocking] = useState(false);
  const [bioError, setBioError] = useState("");
  const [bioBusy, setBioBusy] = useState(false); /* p1400 */
  const saveTimer = useRef(null);
  const toastTimer = useRef(null);
  const firstRender = useRef(true);

  useEffect(() => {
    (async () => {
      const saved = normalizeState(await loadSaved());
      if (saved && saved.setupDone) {
        setState(saved);
        setLocked(Boolean(saved.pin));
      } else {
        setState(saved || blankState());
      }
    })();
  }, []);

  useEffect(() => {
    vsBioSupported().then((s) => {
      setBioSupported(s);
      if (s) {
        try {
          setBioEnrolled(Boolean(localStorage.getItem(VS_BIO_KEY)));
        } catch {
          setBioEnrolled(false);
        }
      }
    });
  }, []);

  useEffect(() => {
    if (state === null) return;
    if (firstRender.current) {
      firstRender.current = false;
      return;
    }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStamp("saving");
    saveTimer.current = setTimeout(async () => {
      const ok = await persist(state);
      setSaveStamp(ok ? new Date() : "error");
    }, 450);
    return () => saveTimer.current && clearTimeout(saveTimer.current);
  }, [state]);

  const toast = (msg) => {
    setToastMsg(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2000);
  };

  const fin = useMemo(() => (state ? computeFinancials(state) : null), [state]);

  if (state === null)
    return (
      <div style={{ fontFamily: baseFont, padding: 40, textAlign: "center", color: MUTED }}>
        Opening VaultStack…
      </div>
    );

  const doBioUnlock = async () => {
    if (bioUnlocking) return;
    setBioUnlocking(true);
    setBioError("");
    try {
      await vsBioUnlock();
      setLocked(false);
    } catch (e) {
      setBioError(e && e.message ? e.message : "Unlock failed. Use your PIN.");
    } finally {
      setBioUnlocking(false);
    }
  };

  const addSale = (s) => setState((st) => ({ ...st, sales: [...st.sales, s] }));
  const addExpense = (e) => setState((st) => ({ ...st, expenses: [...st.expenses, e] }));
  const removeSale = (id) => setState((st) => ({ ...st, sales: st.sales.filter((x) => x.id !== id) }));
  const removeExpense = (id) => setState((st) => ({ ...st, expenses: st.expenses.filter((x) => x.id !== id) }));
  const addLoan = (wid, loan) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: [...w.loans, loan] } : w)),
    }));
  const addPayment = (wid, pay) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: [...w.payments, pay] } : w)),
    }));
  const addAdjustment = (wid, adj) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: [...w.adjustments, adj] } : w)),
    }));
  const removeLoan = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, loans: w.loans.filter((x) => x.id !== id) } : w)),
    }));
  const removePayment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, payments: w.payments.filter((x) => x.id !== id) } : w)),
    }));
  const removeAdjustment = (wid, id) =>
    setState((st) => ({
      ...st,
      workers: st.workers.map((w) => (w.id === wid ? { ...w, adjustments: w.adjustments.filter((x) => x.id !== id) } : w)),
    }));
  const resolveCategory = (raw) => {
    const name = raw.trim();
    const existing = state.expenseCats.find((c) => c.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    setState((st) => ({ ...st, expenseCats: [...st.expenseCats, name] }));
    return name;
  };
  const closeSeason = () =>
    setState((st) => {
      const f = computeFinancials(st);
      const settlements = st.workers.map((w) => {
        const k = workerNumbers(st, w, f);
        return { name: w.name, payout: k.payout };
      });
      const nextYear = new Date().getFullYear();
      return {
        ...st,
        pastSeasons: [
          ...st.pastSeasons,
          { name: st.season.name, netPot: f.netPot, settlements },
        ],
        season: { ...st.season, name: "New Season " + nextYear, start: todayISO() },
        sales: [],
        expenses: [],
        workers: st.workers.map((w) => {
          const k = workerNumbers(st, w, f);
          return { ...w, carriedDebt: k.payout < 0 ? -k.payout : 0, loans: [], payments: [], adjustments: [] };
        }),
      };
    });
  const resetAll = async () => {
    await wipeSaved();
    try {
      localStorage.removeItem(VS_BIO_KEY);
    } catch {}
    setBioEnrolled(false);
    firstRender.current = true;
    setState(blankState());
    setLocked(false);
    setTab("home");
    setFlow(null);
  };

  const shell = (children) => <div className="vs-shell">{children}</div>;

  if (!state.setupDone)
    return shell(
      <div className="vs-scroll" style={{ background: "#fff" }}>
        <Onboarding3
          onFinish={(d) => {
            setState(d);
            setTab("home");
          }}
          onDemo={() => {
            setState(demoState());
            setLocked(true);
          }}
          bio={{
            supported: bioSupported,
            busy: bioBusy,
            error: bioError,
            onEnable: async (d) => {
              setBioBusy(true);
              setBioError("");
              try {
                await vsBioEnroll();
                setBioEnrolled(true);
                setState(d);
                setTab("home");
              } catch (e) {
                setBioError(e && e.message ? e.message : "Could not set up biometric unlock. You can use your PIN.");
              } finally {
                setBioBusy(false);
              }
            },
            onSkip: (d) => {
              setState(d);
              setTab("home");
            },
          }}
        />
      </div>
    );

  if (locked)
    return shell(
      <div style={{ flex: 1, minHeight: 0, display: "flex", background: DEEP, overflow: "hidden" }}>
        <PinPad3
          title="Enter your PIN"
          subtitle={state.company.name}
          errorMsg={pinErr}
          onComplete={async (d) => {
            if (await vsVerifyPin(d, state.pin)) {
              setLocked(false);
              setPinErr("");
              /* quietly upgrade old plain PIN records to the salted format */
              if (!vsPinIsSalted(state.pin)) {
                try {
                  const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)))
                    .map((b) => b.toString(16).padStart(2, "0"))
                    .join("");
                  const record = await vsHashPin(d, salt);
                  setState((st) => ({ ...st, pin: record }));
                } catch {}
              }
            } else {
              setPinErr("Wrong PIN. Try again.");
            }
          }}
          bio={
            bioSupported && bioEnrolled
              ? { available: true, onUnlock: doBioUnlock, unlockError: bioError, unlocking: bioUnlocking }
              : { available: false }
          }
        />
      </div>
    );

  const tabs = [
    { id: "home", Icon: Home, label: "Home" },
    { id: "sales", Icon: Banknote, label: "Sales" },
    { id: "expenses", Icon: Package, label: "Expenses" },
    { id: "workers", Icon: Users, label: "Workers" },
    { id: "more", Icon: Settings, label: "More" },
  ];

  const openSale = () => setFlow("sale");
  const openExpense = () => {
    setExpSession([]);
    setFlow("expense-cat");
  };
  const lock = () => {
    setFlow(null);
    setLocked(true);
  };

  const availableCats = state.expenseCats.filter(
    (c) => !expSession.some((s) => s.cat.toLowerCase() === c.toLowerCase())
  );
  const sessionTotal = expSession.reduce((s, x) => s + x.amount, 0);

  return shell(
    <>
      <div className="vs-scroll">
        {tab === "home" && (
          <HomeTabV2
            state={state}
            fin={fin}
            openSale={openSale}
            openExpense={openExpense}
            go={setTab}
            onLock={lock}
            saveStamp={saveStamp}
          />
        )}
        {tab === "sales" && (
          <SalesTab
            state={state}
            fin={fin}
            openSale={openSale}
            removeSale={removeSale}
            toast={toast}
          />
        )}
        {tab === "expenses" && (
          <ExpensesTab
            state={state}
            fin={fin}
            openExpense={openExpense}
            removeExpense={removeExpense}
            toast={toast}
          />
        )}
        {tab === "workers" && (
          <WorkersTabV2
            state={state}
            fin={fin}
            addLoan={addLoan}
            addPayment={addPayment}
            addAdjustment={addAdjustment}
            removeLoan={removeLoan}
            removePayment={removePayment}
            removeAdjustment={removeAdjustment}
            toast={toast}
          />
        )}
        {tab === "weather" && <WeatherTabV2 onBack={() => setTab("home")} />}
        {tab === "more" && (
          <MoreTabV2
            state={state}
            fin={fin}
            onCloseSeason={closeSeason}
            onReset={resetAll}
            onLock={lock}
            go={setTab}
            bio={{
              supported: bioSupported,
              enrolled: bioEnrolled,
              busy: bioBusy,
              onEnable: async () => {
                setBioBusy(true);
                setBioError("");
                try {
                  await vsBioEnroll();
                  setBioEnrolled(true);
                  toast("Face / fingerprint unlock is on");
                } catch (e) {
                  setBioError(e && e.message ? e.message : "Could not turn on biometric unlock.");
                  toast("Could not set up unlock. Use your PIN.");
                } finally {
                  setBioBusy(false);
                }
              },
              onDisable: () => {
                try {
                  localStorage.removeItem(VS_BIO_KEY);
                } catch {}
                setBioEnrolled(false);
                toast("Face / fingerprint unlock is off");
              },
            }}
          />
        )}
      </div>

      {toastMsg && (
        <div
          style={{
            position: "absolute",
            left: "50%",
            bottom: 96,
            transform: "translateX(-50%)",
            background: DEEP,
            color: "#fff",
            padding: "11px 16px",
            borderRadius: 999,
            fontSize: 13.5,
            fontWeight: 700,
            zIndex: 60,
            maxWidth: "88%",
            display: "flex",
            alignItems: "center",
            gap: 8,
            boxShadow: "0 10px 26px rgba(8,40,30,0.30)",
          }}
        >
          <Check size={16} color={LIME} strokeWidth={3} />
          <span className="truncate">{toastMsg}</span>
        </div>
      )}

      <div style={{ background: DEEP, flexShrink: 0, paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div style={{ display: "flex", alignItems: "stretch", padding: "7px 6px 8px" }}>
          {tabs.map(({ id, Icon, label }) => {
            const on = tab === id;
            return (
              <button
                key={id}
                className="vs-press"
                onClick={() => {
                  setTab(id);
                  setFlow(null);
                }}
                style={{
                  flex: 1,
                  minWidth: 0,
                  border: "none",
                  background: "none",
                  padding: "2px 0",
                  cursor: "pointer",
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 3,
                }}
              >
                <span
                  style={{
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    width: 40,
                    height: 26,
                    borderRadius: 10,
                    background: on ? "rgba(198,240,78,0.16)" : "transparent",
                  }}
                >
                  <Icon size={19} strokeWidth={on ? 2.4 : 2} color={on ? LIME : "rgba(255,255,255,0.62)"} />
                </span>
                <span
                  style={{
                    fontSize: 11,
                    fontWeight: on ? 700 : 500,
                    color: on ? LIME : "rgba(255,255,255,0.62)",
                    fontFamily: baseFont,
                  }}
                >
                  {label}
                </span>
              </button>
            );
          })}
        </div>
      </div>

      {flow === "sale" && (
        <KeypadSheet
          title="Log a fish sale"
          HeaderIcon={Fish}
          subtitle="How much money did you receive?"
          confirmLabel="Save sale"
          onClose={() => setFlow(null)}
          onSave={({ amount, date }) => {
            addSale({ id: uid(), date, amount, note: "", createdAt: new Date().toISOString() });
            setFlow(null);
            toast("Sale saved · " + fmt(amount));
          }}
        />
      )}

      {flow === "expense-cat" && (
        <Modal title="What did you pay for?" onClose={() => setFlow(null)}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {availableCats.map((name) => {
              const Icon = catIcon(name);
              return (
                <button
                  key={name}
                  className="vs-press"
                  onClick={() => {
                    setExpCat(name);
                    setFlow("expense-amt");
                  }}
                  style={{
                    padding: "16px 8px",
                    borderRadius: 14,
                    border: "1px solid " + LINE,
                    background: "#fff",
                    cursor: "pointer",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <Icon size={22} color={NAVY} strokeWidth={2.2} />
                  <span style={{ fontWeight: 700, fontSize: 14.5, color: INK }}>{name}</span>
                </button>
              );
            })}
            <button
              className="vs-press"
              onClick={() => {
                setNewCatName("");
                setFlow("expense-name");
              }}
              style={{
                padding: "16px 8px",
                borderRadius: 14,
                border: "1px dashed #B9C6BF",
                background: "#fff",
                cursor: "pointer",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 8,
              }}
            >
              <Plus size={22} color={NAVY} strokeWidth={2.2} />
              <span style={{ fontWeight: 700, fontSize: 14.5, color: NAVY }}>Other</span>
            </button>
          </div>

          {expSession.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 14.5, color: INK, marginBottom: 4 }}>Logged just now</div>
              {expSession.map((s, i) => {
                const SIcon = catIcon(s.cat);
                return (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
                    <span className="truncate" style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 14.5, color: MUTED }}>
                      <Check size={16} color={GOOD} strokeWidth={3} /> <SIcon size={16} color={NAVY} /> {s.cat}
                    </span>
                    <span className="num" style={{ fontWeight: 700, fontSize: 14 }}>− {fmt(s.amount)}</span>
                  </div>
                );
              })}
              <div style={{ borderTop: "1px solid " + LINE, margin: "4px 0" }} />
              <Row left="Total this sitting" right={"− " + fmt(sessionTotal)} strong />
              <div style={{ height: 10 }} />
              <Btn
                label={<><Check size={19} /> Done</>}
                onClick={() => {
                  setFlow(null);
                  setTab("expenses");
                }}
              />
            </div>
          )}
        </Modal>
      )}

      {flow === "expense-name" && (
        <Modal title="Name this expense" onClose={() => setFlow("expense-cat")}>
          <div style={{ fontSize: 14.5, color: MUTED, marginBottom: 14 }}>
            Give it a name once. It will be saved as a button for next time.
          </div>
          <Field label="What is it called?" value={newCatName} onChange={setNewCatName} placeholder="e.g. Net mending" />
          <Btn
            label="Next"
            disabled={!newCatName.trim()}
            onClick={() => {
              const finalName = resolveCategory(newCatName);
              setExpCat(finalName);
              setFlow("expense-amt");
            }}
          />
        </Modal>
      )}

      {flow === "expense-amt" && (
        <KeypadSheet
          title={"Expense: " + expCat}
          HeaderIcon={catIcon(expCat)}
          subtitle="How much did you pay?"
          confirmLabel="Save expense"
          onClose={() => setFlow("expense-cat")}
          onSave={({ amount, date }) => {
            addExpense({ id: uid(), date, amount, category: expCat, createdAt: new Date().toISOString() });
            setExpSession((prev) => [...prev, { cat: expCat, amount }]);
            toast(expCat + " saved · " + fmt(amount));
            setFlow("expense-cat");
          }}
        />
      )}
    </>
  );
}

/* ============================================================
   Screens — one design system: green headers, flat white cards,
   tabular money, no decoration that does not carry information.
   ============================================================ */
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';

function Avatar({ name, size = 44 }) {
  const parts = (name || "?").trim().split(/\s+/);
  const initials = parts.slice(0, 2).map((p) => p[0] || "").join("").toUpperCase() || "?";
  return (
    <div
      style={{
        width: size,
        height: size,
        borderRadius: 999,
        background: SOFT,
        color: NAVY,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontWeight: 800,
        fontSize: Math.round(size * 0.36),
        letterSpacing: 0.3,
        flexShrink: 0,
      }}
    >
      {initials}
    </div>
  );
}

function useSea() {
  const [wx, setWx] = useState({ status: "loading" });
  useEffect(() => {
    let alive = true;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    (async () => {
      try {
        const [mr, fr] = await Promise.all([
          fetch(
            "https://marine-api.open-meteo.com/v1/marine?" + SEA_POINT + "&current=wave_height",
            { signal: ctrl.signal }
          ),
          fetch(
            "https://api.open-meteo.com/v1/forecast?" + SEA_POINT + "&current=wind_speed_10m,precipitation&wind_speed_unit=kmh",
            { signal: ctrl.signal }
          ),
        ]);
        const mj = await mr.json();
        const fj = await fr.json();
        if (!alive) return;
        setWx({
          status: "live",
          wave: mj.current?.wave_height ?? 0,
          wind: fj.current?.wind_speed_10m ?? 0,
          rain: fj.current?.precipitation ?? 0,
        });
      } catch {
        if (!alive) return;
        setWx({ status: "demo", wave: 0.9, wind: 14, rain: 0 });
      } finally {
        clearTimeout(t);
      }
    })();
    return () => {
      alive = false;
      ctrl.abort();
      clearTimeout(t);
    };
  }, []);
  return wx;
}

function seaVerdict(wx) {
  if (!wx || wx.status === "loading") return { label: "CHECKING", col: NAVY, msg: "" };
  return wx.wave >= 2 || wx.wind >= 30
    ? { label: "STAY ASHORE", col: BAD, msg: "The sea is dangerous today. Do not go out." }
    : wx.wave >= 1.2 || wx.wind >= 20 || wx.rain >= 2
    ? { label: "CAUTION", col: WARN, msg: "Conditions are rough. Go carefully or wait." }
    : { label: "SAFE", col: GOOD, msg: "Good conditions for fishing today." };
}

function ExpensesTab({ state, fin, openExpense, removeExpense, toast }) {
  const [del, setDel] = useState(null);
  const total = fin.fixedTotal + fin.varTotal;

  const byCat = useMemo(() => {
    const map = {};
    state.expenses.forEach((e) => {
      const c = e.category || "Other";
      map[c] = (map[c] || 0) + (Number(e.amount) || 0);
    });
    return Object.keys(map)
      .map((c) => ({ cat: c, total: map[c] }))
      .sort((a, b) => b.total - a.total);
  }, [state.expenses]);

  const grouped = useMemo(() => {
    const byDate = {};
    state.expenses.forEach((e) => {
      (byDate[e.date] = byDate[e.date] || []).push(e);
    });
    const dates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));
    return { dates, byDate };
  }, [state.expenses]);

  return (
    <div>
      <PageHead
        title="Expenses"
        sub={(state.season.name || "This season") + " · " + (state.expenses.length + state.season.fixed.length) + " entries"}

            <Btn label={<><Minus size={18} /> Log expense</>} kind="onGreen" onClick={openExpense} />

        {state.season.fixed.length > 0 ? (
          <div>
            <SectionHead text="Fixed season costs" />

              {state.season.fixed.map((f) => (
                <Row key={f.id} left={f.name} right={fmt(f.amount)} />
              ))}
              <div style={{ borderTop: "1px solid " + LINE, margin: "6px 0 2px" }} />
              <Row left="Total fixed" right={fmt(fin.fixedTotal)} strong />
            </Card>
          </div>
        ) : null}

        {byCat.length > 0 ? (
          <div>
            <SectionHead text="Where the money went" />
            <Card pad={0} style={{ overflow: "hidden" }}>
              {byCat.map((c, i) => {
                const Icon = catIcon(c.cat);
                return (
                  <ListRow
                    key={c.cat}

                    sub={total > 0 ? Math.round((c.total / total) * 100) + "% of all spending" : ""}
                    amount={fmt(c.total)}
                    last={i === byCat.length - 1}
                  />
                );
              })}
            </Card>
          </div>
        ) : null}

        <SectionHead text="Every expense" />
        {state.expenses.length === 0 ? (
          <Card pad={14}>

      </div>
    </div>
  );
}

/* ---------------- More: company, access, season ---------------- */
function MoreTabV2({ state, fin, onCloseSeason, onReset, onLock, go, bio }) {
  const [confirm, setConfirm] = useState(false);
  const [resetAsk, setResetAsk] = useState(false);

  const bioSub = !bio
    ? ""
    : bio.enrolled
    ? "On — your phone confirms it is you"
    : bio.supported
    ? "Turn on to unlock without typing the PIN"
    : "Not available on this device or browser";

  const bioAction = !bio || !bio.supported ? null : bio.enrolled ? bio.onDisable : bio.onEnable;

  return (
    <div>
      <PageHead title="More" sub={state.company.name || "Company settings"} />
      <div style={{ padding: "0 14px" }}>
        <Card pad={14}>
          <div style={{ fontSize: 17, fontWeight: 800, color: INK }}>{state.company.name}</div>
          <div className="truncate" style={{ fontSize: 13, color: MUTED, marginTop: 2 }}>
            {(state.company.owner || "Owner not set") + (state.company.phone ? " · " + state.company.phone : "")}
          </div>
          <div style={{ borderTop: "1px solid " + LINE, margin: "10px 0 4px" }} />
          <Row left="Season" right={state.season.name || "\u2014"} />
          <Row left="Started" right={fmtDate(state.season.start)} />
          <Row left="Crew" right={state.workers.length + " workers · " + fin.totalUnits + " units"} />
          <Row left="Each unit is worth" right={fmt(fin.vpu)} />
        </Card>

        {state.positions.length > 0 ? (
          <div>
            <SectionHead text="Positions" />
            <Card pad={0} style={{ overflow: "hidden" }}>
              {state.positions.map((p, i) => {
                const holders = state.workers.filter((w) => w.positionId === p.id).map((w) => w.name);
                return (
                  <ListRow
                    key={p.id}
                    Icon={Star}
                    iconColor={GOLD}
                    title={p.name}
                    sub={holders.length ? holders.join(", ") : "Not assigned to anyone"}
                    amount={fmt(p.pay)}
                    last={i === state.positions.length - 1}
                  />
                );
              })}
            </Card>
          </div>
        ) : null}

        <SectionHead text="Access" />
        <Card pad={0} style={{ overflow: "hidden" }}>
          {onLock ? (
            <ListRow Icon={Lock} title="Lock VaultStack now" sub="Ask for the PIN again" onClick={onLock} />
          ) : null}
          <ListRow
            Icon={Star}
            iconColor={NAVY}
            title="Face / fingerprint unlock"
            sub={bioSub}
            amount={bio && bio.enrolled ? (bio.busy ? "…" : "On") : bio && bio.supported ? (bio.busy ? "…" : "Off") : "—"}
            amountTone={bio && bio.enrolled ? GOOD : MUTED}
            onClick={bioAction || undefined}
            last
          />
        </Card>
        {bio && !bio.enrolled && bio.supported ? (
          <div style={{ fontSize: 12, color: MUTED, padding: "6px 2px 0", lineHeight: 1.45 }}>
            Your phone’s Face ID, Touch ID or fingerprint unlocks the app. No fingerprint data
            touches VaultStack, and your PIN still works if a scan fails.
          </div>
        ) : null}

        <SectionHead text="Sea" />
        <Card pad={0} style={{ overflow: "hidden" }}>
          <ListRow Icon={Waves} title="Sea conditions at Adina" sub="Wind, waves and rain" onClick={() => go("weather")} last />
        </Card>

        {state.pastSeasons.length > 0 ? (
          <div>
            <SectionHead text="Past seasons" />
            <Card pad={0} style={{ overflow: "hidden" }}>
              {state.pastSeasons.map((p, i) => (
                <ListRow
                  key={i}
                  Icon={Fish}
                  title={p.name}
                  sub={p.settlements ? p.settlements.length + " workers settled" : ""}
                  amount={fmt(p.netPot)}
                  last={i === state.pastSeasons.length - 1}
                />
              ))}
            </Card>
          </div>
        ) : null}

        <SectionHead text="Season" />
        <Btn label="Close this season" kind="danger" onClick={() => setConfirm(true)} />
        <div style={{ height: 10 }} />
        <Btn label="Erase all data and start over" kind="quiet" onClick={() => setResetAsk(true)} />
        <div style={{ height: 14 }} />
      </div>

      {confirm && (
        <Modal title="Close the season?" onClose={() => setConfirm(false)}>
          <div style={{ fontSize: 14.5, color: MUTED, marginBottom: 12, lineHeight: 1.45 }}>
            Final payouts are locked and saved. Any worker debt carries to the next season
            automatically.
          </div>
          <Card pad={12} style={{ background: MIST, border: "none" }}>
            {state.workers.map((w) => {
              const k = workerNumbers(state, w, fin);
              return (
                <Row
                  key={w.id}
                  left={w.name}
                  right={k.payout < 0 ? "Carries debt " + fmt(-k.payout) : "Take home " + fmt(k.payout)}
                  color={k.payout < 0 ? BAD : INK}
                />
              );
            })}
            <div style={{ borderTop: "1px solid " + LINE, margin: "6px 0 2px" }} />
            <Row left="Pot shared by units" right={fmt(fin.potForSplit)} strong />
          </Card>
          <Btn
            label="Yes, close the season"
            onClick={() => {
              setConfirm(false);
              onCloseSeason();
            }}
          />
        </Modal>
      )}

      {resetAsk && (
        <Modal title="Erase everything?" onClose={() => setResetAsk(false)}>
          <div style={{ fontSize: 14.5, color: MUTED, marginBottom: 12, lineHeight: 1.45 }}>
            This deletes the company, crew, sales, expenses and past seasons saved on this phone.
            It cannot be undone.
          </div>
          <Btn
            label="Yes, erase all data"
            kind="dangerSolid"
            onClick={() => {
              setResetAsk(false);
              onReset();
            }}
          />
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Workers (crew) ---------------- */
function WorkersTabV2({
  state,
  fin,
  addLoan,
  addPayment,
  addAdjustment,
  removeLoan,
  removePayment,
  removeAdjustment,
  toast,
}) {
  const [openId, setOpenId] = useState(null);
  const [sub, setSub] = useState(null);
  const [payDesc, setPayDesc] = useState("");
  const [goodsOther, setGoodsOther] = useState("");
  const [adjKind, setAdjKind] = useState("deduction");
  const [adjReason, setAdjReason] = useState("");
  const [adjOther, setAdjOther] = useState("");
  const [copied, setCopied] = useState(false);
  const [del, setDel] = useState(null);

  const w = state.workers.find((x) => x.id === openId) || null;
  const n = w ? workerNumbers(state, w, fin) : null;
  const posName = w && w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;

  const histRows = w
    ? [
        ...w.loans.map((l) => ({ ...l, k: "loan" })),
        ...w.payments.map((p) => ({ ...p, k: "pay" })),
        ...w.adjustments.map((a) => ({ ...a, k: "adj" })),
      ].sort((a, b) => (a.date < b.date ? 1 : -1))
    : [];

  const histLabel = (h) => {
    if (h.k === "loan") return "Loan";
    if (h.k === "pay") return h.desc || "Payment";
    return (h.kind === "bonus" ? "Bonus" : "Deduction") + (h.reason ? " · " + h.reason : "");
  };
  const histAmount = (h) =>
    h.k === "adj" && h.kind === "bonus" ? "+ " + fmt(h.amount) : "\u2212 " + fmt(h.amount);

  const crewTotal = state.workers.reduce((s, wk) => {
    const k = workerNumbers(state, wk, fin);
    return s + Math.max(0, k.payout);
  }, 0);
  const crewDebt = state.workers.reduce((s, wk) => {
    const k = workerNumbers(state, wk, fin);
    return s + Math.max(0, -k.payout);
  }, 0);

  return (
    <div>
      <PageHead
        title="Workers"
        sub={state.workers.length + " in the crew · " + fin.totalUnits + " share units"}
      />
      <div style={{ padding: "0 14px" }}>
        <div style={{ background: NAVY, borderRadius: 16, padding: 16 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "rgba(255,255,255,0.74)" }}>
            To pay out if the season closed today
          </div>
          <div className="num" style={{ fontSize: 27, fontWeight: 800, color: "#fff", marginTop: 2 }}>
            {fmt(crewTotal)}
          </div>
          <div style={{ fontSize: 12, color: "rgba(255,255,255,0.72)", marginTop: 5 }}>
            Owing to the boat <b className="num" style={{ color: "#fff" }}>{fmt(crewDebt)}</b> · each unit{" "}
            {fmt(fin.vpu)}
          </div>
        </div>

        <SectionHead text="Crew list" />
        {state.workers.length === 0 ? (
          <Card pad={14}>
            <div style={{ fontSize: 14, color: MUTED }}>No workers on this season yet.</div>
          </Card>
        ) : (
          <Card pad={0} style={{ overflow: "hidden" }}>
            {state.workers.map((wk, i) => {
              const k = workerNumbers(state, wk, fin);
              const pn = wk.positionId
                ? (state.positions.find((p) => p.id === wk.positionId) || {}).name
                : null;
              const heavy = k.loansTotal + k.carried > k.grossShare * 0.7;
              return (
                <div
                  key={wk.id}
                  className="vs-press"
                  onClick={() => {
                    setOpenId(wk.id);
                    setSub(null);
                    setCopied(false);
                  }}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 12,
                    padding: "12px 14px",
                    cursor: "pointer",
                    borderBottom: i === state.workers.length - 1 ? "none" : "1px solid " + LINE,
                  }}
                >
                  <Avatar name={wk.name} size={40} />
                  <div className="truncate" style={{ flex: 1, minWidth: 0 }}>
                    <div className="truncate" style={{ fontWeight: 700, fontSize: 15, color: INK }}>
                      {wk.name}
                    </div>
                    <div className="truncate" style={{ fontSize: 12.5, color: MUTED, marginTop: 1 }}>
                      {(pn ? pn + " · " : "") + wk.units + " units"}
                    </div>
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div
                      className="num"
                      style={{ fontSize: 15, fontWeight: 700, color: k.payout < 0 ? BAD : INK }}
                    >
                      {fmt(k.payout)}
                    </div>
                    <div
                      style={{
                        fontSize: 11,
                        fontWeight: 700,
                        marginTop: 2,
                        color: k.payout < 0 ? BAD : heavy ? WARN : GOOD,
                      }}
                    >
                      {k.payout < 0 ? "In debt" : heavy ? "Borrowed a lot" : "Take home"}
                    </div>
                  </div>
                </div>
              );
            })}
          </Card>
        )}
        <div style={{ fontSize: 12, color: MUTED, padding: "2px 2px 10px" }}>
          Tap a worker for the payout breakdown, loans and WhatsApp statement.
        </div>
      </div>

      {w && sub === null && (
        <Modal title={w.name + (posName ? " · " + posName : "")} onClose={() => setOpenId(null)}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
            <Avatar name={w.name} size={46} />
            <div className="truncate" style={{ minWidth: 0 }}>
              <div className="truncate" style={{ fontWeight: 800, fontSize: 17, color: INK }}>{w.name}</div>
              <div className="truncate" style={{ fontSize: 13, color: MUTED }}>
                {(posName ? posName + " · " : "") + w.units + " of " + fin.totalUnits + " units"}
              </div>
            </div>
          </div>

          <div style={{ background: NAVY, borderRadius: 16, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.74)" }}>Will take home</div>
            <div className="num" style={{ fontSize: 25, fontWeight: 800, color: "#fff", marginTop: 2 }}>
              {fmt(n.payout)}
            </div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.72)", marginTop: 4 }}>
              Can still borrow {fmt(n.borrowLimit)}
            </div>
          </div>

          <Card pad={14} style={{ background: MIST, border: "none" }}>
            <Row left="Value per unit" right={fmt(fin.vpu)} />
            <Row left={w.units + " units × " + fmt(fin.vpu)} right={fmt(n.unitShare)} />
            {n.posPay > 0 ? <Row left={"Position pay (" + posName + ")"} right={"+ " + fmt(n.posPay)} /> : null}
            <Row left="Bonuses" right={"+ " + fmt(n.bonusTotal)} />
            <Row left="Deductions" right={"\u2212 " + fmt(n.dedTotal)} />
            <Row left="Loans this season" right={"\u2212 " + fmt(n.loansTotal)} />
            <Row left="Payments received" right={"\u2212 " + fmt(n.paymentsTotal)} />
            <Row left="Debt from last season" right={"\u2212 " + fmt(n.carried)} />
            <div style={{ borderTop: "1px solid " + LINE, margin: "6px 0 2px" }} />
            <Row left="Payout so far" right={fmt(n.payout)} strong color={n.payout < 0 ? BAD : SEA} />
          </Card>

          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Btn label="Give loan" kind="ghost" onClick={() => setSub("loan")} />
            <Btn label="Record payment" kind="ghost" onClick={() => setSub("pay-type")} />
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <Btn
              label={<><Plus size={18} /> Bonus</>}
              kind="ghost"
              onClick={() => { setAdjKind("bonus"); setAdjReason(""); setAdjOther(""); setSub("adj-reason"); }}
            />
            <Btn
              label={<><Minus size={18} /> Deduct</>}
              kind="ghost"
              onClick={() => { setAdjKind("deduction"); setAdjReason(""); setAdjOther(""); setSub("adj-reason"); }}
            />
          </div>
          <Btn label={<><MessageCircle size={20} /> Send statement</>} onClick={() => setSub("statement")} />
          {histRows.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontWeight: 800, fontSize: 15, color: NAVY }}>History</div>
              <div style={{ fontSize: 13, color: MUTED, marginBottom: 4 }}>Tap an entry to remove it.</div>
              {histRows.map((h) => (
                <div
                  key={h.id}
                  onClick={() => setDel(h)}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "baseline",
                    padding: "8px 0",
                    cursor: "pointer",
                  }}
                >
                  <span style={{ fontSize: 15.5, color: MUTED }}>
                    {histLabel(h)} · {fmtDate(h.date)}
                  </span>
                  <span
                    style={{
                      fontFamily: MONO2,
                      fontWeight: 700,
                      fontSize: 14,
                      fontVariantNumeric: "tabular-nums",
                      color: h.k === "adj" && h.kind === "bonus" ? GOOD : INK,
                    }}
                  >
                    {histAmount(h)}
                  </span>
                </div>
              ))}
            </div>
          )}
        </Modal>
      )}

      {w && sub === "loan" && (
        <KeypadSheet
          title={"Loan for " + w.name}
          HeaderIcon={Banknote}
          subtitle={"Can borrow up to " + fmt(n.borrowLimit)}
          quick={[50, 100, 200]}
          maxAmount={n.borrowLimit}
          maxMsg="More than the borrowing limit."
          confirmLabel="Save loan"
          onClose={() => setSub(null)}
          onSave={({ amount, date }) => {
            addLoan(w.id, { id: uid(), date, amount, note: "" });
            setSub(null);
            toast("Loan saved · " + fmt(amount));
          }}
        />
      )}

      {w && sub === "pay-type" && (
        <Modal title={"Payment to " + w.name} onClose={() => setSub(null)}>
          <div style={{ fontSize: 15, color: MUTED, marginBottom: 14 }}>What did {w.name} receive?</div>
          <Btn label={<><Banknote size={20} /> Cash</>} onClick={() => { setPayDesc("Cash"); setSub("pay-amt"); }} />
          <div style={{ height: 10 }} />
          <Btn label={<><Package size={20} /> Goods</>} kind="ghost" onClick={() => { setGoodsOther(""); setSub("pay-goods"); }} />
        </Modal>
      )}

      {w && sub === "pay-goods" && (
        <Modal title="What goods?" onClose={() => setSub("pay-type")}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            {GOODS_PRESETS.map((g) => (
              <button
                key={g}
                onClick={() => { setPayDesc(g); setSub("pay-amt"); }}
                style={{
                  padding: "16px 8px",
                  borderRadius: 10,
                  border: "1px solid " + LINE,
                  background: "#fff",
                  fontWeight: 700,
                  fontSize: 15.5,
                  color: INK,
                  cursor: "pointer",
                }}
              >
                {g}
              </button>
            ))}
          </div>
          <Field label="Or type something else" value={goodsOther} onChange={setGoodsOther} placeholder="e.g. Outboard oil" />
          <Btn label="Next" disabled={!goodsOther.trim()} onClick={() => { setPayDesc(goodsOther.trim()); setSub("pay-amt"); }} />
        </Modal>
      )}

      {w && sub === "pay-amt" && (
        <KeypadSheet
          title={"Payment to " + w.name}
          HeaderIcon={payDesc === "Cash" ? Banknote : Package}
          subtitle={payDesc === "Cash" ? "Cash payment" : payDesc + " — agreed value"}
          quick={[20, 50, 100]}
          confirmLabel="Save payment"
          onClose={() => setSub("pay-type")}
          onSave={({ amount, date }) => {
            addPayment(w.id, {
              id: uid(),
              date,
              type: payDesc === "Cash" ? "cash" : "goods",
              amount,
              desc: payDesc,
            });
            setSub(null);
            toast("Payment saved · " + fmt(amount));
          }}
        />
      )}

      {w && sub === "adj-reason" && (
        <Modal title={adjKind === "bonus" ? "Bonus for " + w.name : "Deduction for " + w.name} onClose={() => setSub(null)}>
          <div style={{ fontSize: 15, color: MUTED, marginBottom: 14 }}>
            {adjKind === "bonus" ? "Why the bonus?" : "Why the deduction?"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
            {(adjKind === "bonus" ? BONUS_REASONS : DEDUCT_REASONS).map((r) => (
              <button
                key={r}
                onClick={() => { setAdjReason(r); setSub("adj-amt"); }}
                style={{
                  padding: "16px 8px",
                  borderRadius: 10,
                  border: "1px solid " + LINE,
                  background: "#fff",
                  fontWeight: 700,
                  fontSize: 15.5,
                  color: INK,
                  cursor: "pointer",
                }}
              >
                {r}
              </button>
            ))}
          </div>
          <Field label="Or type another reason" value={adjOther} onChange={setAdjOther} placeholder="e.g. Helped repair engine" />
          <Btn label="Next" disabled={!adjOther.trim()} onClick={() => { setAdjReason(adjOther.trim()); setSub("adj-amt"); }} />
        </Modal>
      )}

      {w && sub === "adj-amt" && (
        <KeypadSheet
          title={(adjKind === "bonus" ? "Bonus: " : "Deduction: ") + adjReason}
          HeaderIcon={adjKind === "bonus" ? Plus : Minus}
          subtitle={adjKind === "bonus" ? "Extra money for " + w.name : "Money removed from " + w.name + "'s payout"}
          quick={[20, 50, 100]}
          confirmLabel={adjKind === "bonus" ? "Save bonus" : "Save deduction"}
          onClose={() => setSub("adj-reason")}
          onSave={({ amount, date }) => {
            addAdjustment(w.id, { id: uid(), date, kind: adjKind, amount, reason: adjReason });
            setSub(null);
            toast((adjKind === "bonus" ? "Bonus saved · " : "Deduction saved · ") + fmt(amount));
          }}
        />
      )}

      {w && sub === "statement" && (
        <Modal title={"Statement for " + w.name} onClose={() => setSub(null)}>
          <pre
            style={{
              background: MIST,
              borderRadius: 10,
              padding: 14,
              fontSize: 13.5,
              whiteSpace: "pre-wrap",
              fontFamily: MONO2,
              color: INK,
            }}
          >
            {buildStatement(state, fin, w)}
          </pre>
          <a
            href={waLink(w.phone, buildStatement(state, fin, w))}
            target="_blank"
            rel="noreferrer"
            style={{ textDecoration: "none", display: "block", marginBottom: 10 }}
          >
            <Btn label={<><MessageCircle size={20} /> Share on WhatsApp</>} onClick={() => {}} />
          </a>
          <Btn
            label={copied ? <><Check size={20} /> Copied</> : <><Copy size={20} /> Copy text</>}
            kind="ghost"
            onClick={() => copyText(buildStatement(state, fin, w)).then(() => setCopied(true))}
          />
        </Modal>
      )}

      {w && del && (
        <ConfirmRemove
          title={histLabel(del) + " · " + fmt(del.amount)}
          lines={[fmtDate(del.date)]}
          onClose={() => setDel(null)}
          onConfirm={() => {
            if (del.k === "loan") removeLoan(w.id, del.id);
            else if (del.k === "pay") removePayment(w.id, del.id);
            else removeAdjustment(w.id, del.id);
            setDel(null);
            toast("Entry removed");
          }}
        />
      )}
    </div>
  );
}

/* ---------------- KeypadSheet: MoMo-style amount entry ---------------- */
function KeypadSheet({
  title,
  HeaderIcon,
  subtitle,
  quick = [],
  maxAmount = null,
  maxMsg = "More than the limit.",
  confirmLabel = "Save",
  onSave,
  onClose,
}) {
  const [val, setVal] = useState("");
  const [date, setDate] = useState(todayISO());
  const [editDate, setEditDate] = useState(false);
  const amount = Number(val) || 0;
  const over = maxAmount != null && amount > maxAmount;

  const press = (k) => {
    if (k === "del") return setVal((v) => v.slice(0, -1));
    setVal((v) => {
      if (k === "." && v.includes(".")) return v;
      if (v.includes(".") && v.split(".")[1].length >= 2) return v;
      if (v.replace(".", "").length >= 8) return v;
      if (v === "" && k === ".") return "0.";
      if (v === "0" && k !== ".") return k;
      return v + k;
    });
  };

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", ".", "0", "del"];

  return (
    <Modal title={title} onClose={onClose}>
      {subtitle && (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 8,
            fontSize: 13.5,
            color: MUTED,
            marginBottom: 10,
          }}
        >
          {HeaderIcon && <HeaderIcon size={17} color={NAVY} />}
          <span className="truncate">{subtitle}</span>
        </div>
      )}

      <div
        style={{
          background: SOFT,
          borderRadius: 16,
          padding: "16px 16px 12px",
          textAlign: "center",
          marginBottom: 12,
        }}
      >
        <div
          className="num"
          style={{
            fontSize: 33,
            fontWeight: 800,
            color: over ? BAD : NAVY,
            lineHeight: 1.15,
          }}
        >
          GH₵ {val === "" ? "0" : val}
        </div>
        <button
          onClick={() => setEditDate((e) => !e)}
          style={{
            border: "none",
            background: "none",
            color: MUTED,
            fontSize: 13,
            fontWeight: 700,
            textDecoration: "underline",
            cursor: "pointer",
            marginTop: 6,
            padding: 0,
          }}
        >
          {date === todayISO() ? "Today" : fmtDate(date)} · change
        </button>
        {editDate && (
          <div style={{ marginTop: 10 }}>
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              style={{
                padding: "10px 12px",
                fontSize: 16,
                border: "1px solid " + LINE,
                borderRadius: 12,
                fontFamily: baseFont,
                background: "#fff",
                color: INK,
              }}
            />
          </div>
        )}
      </div>

      {quick.length > 0 && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {quick.map((q) => {
            const on = val === String(q);
            return (
              <button
                key={q}
                className="vs-press"
                onClick={() => setVal(String(q))}
                style={{
                  flex: 1,
                  padding: "11px 0",
                  borderRadius: 12,
                  border: "1px solid " + (on ? NAVY : LINE),
                  background: on ? SOFT : "#fff",
                  color: NAVY,
                  fontWeight: 700,
                  fontSize: 15,
                  cursor: "pointer",
                }}
              >
                {q}
              </button>
            );
          })}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 12 }}>
        {keys.map((k, i) => (
          <Key key={i} onClick={() => press(k)}>
            {k === "del" ? <Delete size={21} /> : k}
          </Key>
        ))}
      </div>

      {maxAmount != null && (
        <div
          style={{
            fontSize: 13,
            fontWeight: 700,
            color: over ? BAD : MUTED,
            marginBottom: 10,
            textAlign: "center",
          }}
        >
          {over ? maxMsg : "Limit: " + fmt(maxAmount)}
        </div>
      )}

      <Btn
        label={confirmLabel + (amount > 0 ? " · " + fmt(amount) : "")}
        disabled={!amount || over}
        onClick={() => onSave({ amount, date })}
      />
    </Modal>
  );
}

/* ---------------- statement helpers ---------------- */
function buildStatement(state, fin, w) {
  const n = workerNumbers(state, w, fin);
  const posName = w.positionId
    ? (state.positions.find((p) => p.id === w.positionId) || {}).name
    : null;
  const lines = [
    "VAULTSTACK STATEMENT",
    state.company.name,
    "Season: " + state.season.name,
    "For: " + w.name + (posName ? " (" + posName + ")" : ""),
    "------------------------------",
    `Share units: ${w.units} of ${fin.totalUnits}`,
    "Value per unit: " + fmt(fin.vpu),
    "Share from units: " + fmt(n.unitShare),
  ];
  if (n.posPay > 0) lines.push("Position pay (" + posName + "): + " + fmt(n.posPay));
  lines.push(
    "Bonuses: + " + fmt(n.bonusTotal),
    "Deductions: − " + fmt(n.dedTotal),
    "Loans taken: − " + fmt(n.loansTotal),
    "Payments received: − " + fmt(n.paymentsTotal),
    "Debt from last season: − " + fmt(n.carried),
    "------------------------------",
    "PAYOUT SO FAR: " + fmt(n.payout),
    n.payout < 0
      ? "Note: this debt will carry to next season."
      : "Estimate only — final amount at season close."
  );
  return lines.join("\n");
}
function waLink(phone, text) {
  let p = (phone || "").replace(/\D/g, "");
  if (p.startsWith("0")) p = "233" + p.slice(1);
  const base = p ? "https://wa.me/" + p : "https://wa.me/";
  return base + "?text=" + encodeURIComponent(text);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(
      () => true,
      () => fallbackCopy(text)
    );
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch {
    return false;
  }
}
